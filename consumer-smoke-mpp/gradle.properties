# Standalone Android/Wasm consumer configuration.
# Required because the Android Gradle Plugin validates AndroidX dependencies
# across configurations in the same multiplatform build, including Wasm.
android.useAndroidX=true

# Keep the existing KMP androidTarget and instrumented-test variant on AGP 9.
# These compatibility flags can be removed when migrating to the Android KMP plugin.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Compose/Wasm production executable compilation needs substantially more heap
# than the metadata/target compile probes. Keep the Gradle process bounded and
# reserve the larger heap for the Kotlin compiler daemon.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=daemon
