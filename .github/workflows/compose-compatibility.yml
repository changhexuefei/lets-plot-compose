      GRAPHITE_LWJGL_VERSION: '3.4.3'

    steps:
      - name: Checkout render-path provider probe source
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download recompiled Compose Maven repository
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-compose-recompiled-maven-${{ github.sha }}
          path: compose-recompiled

      - name: Set up JDK 21 render-path provider runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up render-path provider Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Capture Windows Vulkan environment
        shell: pwsh
        run: |
          $probeDir = "compose\graphite-render-path-provider-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "windows-vulkan-environment.txt"
          "os=$([System.Environment]::OSVersion.VersionString)" | Set-Content $report
          "vulkan.loader.exists=$(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")" | Add-Content $report
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterRAM |
            Format-List | Out-String | Add-Content $report
          Get-Content $report

      - name: Configure browser SwiftShader Vulkan ICD
        shell: pwsh
        run: |
          $probeDir = "compose\graphite-render-path-provider-probe\build\probe"
          $report = Join-Path $probeDir "windows-vulkan-environment.txt"
          $roots = @(
            "$env:ProgramFiles\Google\Chrome\Application",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application",
            "$env:ProgramFiles\Microsoft\Edge\Application",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $icd = $roots |
            ForEach-Object { Get-ChildItem -Path $_ -Filter 'vk_swiftshader_icd.json' -File -Recurse -ErrorAction SilentlyContinue } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $icd) {
            $json = Get-Content $icd.FullName -Raw | ConvertFrom-Json
            $resolvedLibrary = Join-Path $icd.Directory.FullName $json.ICD.library_path
            if (!(Test-Path $resolvedLibrary)) {
              throw "Browser SwiftShader ICD manifest found, but its library is missing: $resolvedLibrary"
            }

            $directDir = Join-Path $env:RUNNER_TEMP 'letsplot-swiftshader-vulkan-render-path-provider'
            New-Item -ItemType Directory -Force -Path $directDir | Out-Null
            $directDll = Join-Path $directDir 'vulkan-1.dll'
            Copy-Item -Path $resolvedLibrary -Destination $directDll -Force

            "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_PROVIDER=browser-swiftshader-direct" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_DIRECT_DLL=$directDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            "vulkan.provider=browser-swiftshader-direct" | Add-Content $report
            "vulkan.icd=$($icd.FullName)" | Add-Content $report
            "vulkan.icd.library=$resolvedLibrary" | Add-Content $report
            "vulkan.direct.dll=$directDll" | Add-Content $report
          } else {
            "GRAPHITE_VULKAN_PROVIDER=system" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "vulkan.provider=system" | Add-Content $report
            "vulkan.icd=not-found" | Add-Content $report
          }

          Get-Content $report

      - name: Verify render-path provider dependency set
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
        run: |
          $probeDir = "graphite-render-path-provider-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-render-path-provider-dependencies.txt"

          .\gradlew.bat -p graphite-render-path-provider-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency lets-plot-compose-desktop --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-render-path-provider-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency skiko-graphite --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.lets-plot:lets-plot-compose-desktop:3\.2\.3-SNAPSHOT",
            "org\.jetbrains\.skiko:skiko-graphite-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-graphite-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "Render-path provider dependency evidence missing: $pattern"
            }
          }

      - name: Run Graphite render-path provider probe
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-render-path-provider-probe\build\probe
        run: |
          .\gradlew.bat -p graphite-render-path-provider-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean graphiteRenderPathProviderProbe --stacktrace

      - name: Verify Graphite render-path provider contract
        shell: pwsh
        run: |
          $result = "compose\graphite-render-path-provider-probe\build\probe\graphite-render-path-provider.txt"
          $software = "compose\graphite-render-path-provider-probe\build\probe\direct-native-canvas.png"
          $graphite = "compose\graphite-render-path-provider-probe\build\probe\graphite-provider-offscreen.png"
          $composite = "compose\graphite-render-path-provider-probe\build\probe\graphite-provider-composited.png"
          $secondFrame = "compose\graphite-render-path-provider-probe\build\probe\graphite-provider-second-frame.png"
          $resizedFrame = "compose\graphite-render-path-provider-probe\build\probe\graphite-provider-resized-frame.png"

          foreach ($file in @($result, $software, $graphite, $composite, $secondFrame, $resizedFrame)) {
            if (!(Test-Path $file)) { throw "Graphite render-path provider evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=GRAPHITE_RENDER_TARGET_FAILURE_RECOVERY_CAPABLE$',
            '^feature_flag.property=letsplot\.compose\.desktop\.renderPath$',
            '^feature_flag.value=graphite-offscreen$',
            '^feature_flag.resolve=PASS$',
            '^requested.path=OFFSCREEN_COMPOSITE$',
            '^effective.path=OFFSCREEN_COMPOSITE$',
            '^production.renderer.default=NATIVE_CANVAS$',
            '^provider.binding=DesktopOffscreenRendererRegistry$',
            '^provider.install=PASS$',
            '^provider.invoked=PASS$',
            '^provider.width=960$',
            '^provider.height=640$',
            '^graphite.context=CREATED$',
            '^graphite.context.create_count=1$',
            '^graphite.context.reuse=PASS$',
            '^graphite.context.reuse_count=22$',
            '^graphite.surface=CREATED$',
            '^graphite.provider.paint=PASS$',
            '^graphite.submit=PASS$',
            '^graphite.snapshot=PASS$',
            '^graphite.readback=PASS$',
            '^provider.composite_to_target=PASS$',
            '^provider.registration.dispose=PASS$',
            '^provider.lifecycle=PERSISTENT_CONTEXT_AND_RENDER_TARGET$',
            '^provider.paint_count=23$',
            '^successful_frame.count=21$',
            '^failure_recovery.count=2$',
            '^same_size.consistency=PASS$',
            '^resized.consistency=PASS$',
            '^failure.paint.injected=PASS$',
            '^failure.paint.caught=PASS$',
            '^failure.paint.target_preserved=PASS$',
            '^failure.paint.layout_preserved=PASS$',
            '^failure.paint.recovery=PASS$',
            '^failure.resize.create.injected=PASS$',
            '^failure.resize.target_released=PASS$',
            '^failure.resize.caught=PASS$',
            '^failure.resize.no_stale_target=PASS$',
            '^failure.resize.recovery=PASS$',
            '^render_target.lifecycle=PERSISTENT_BY_SIZE$',
            '^render_target.create_count=2$',
            '^render_target.reuse=PASS$',
            '^render_target.reuse_count=20$',
            '^render_target.resize=PASS$',
            '^render_target.resize_count=1$',
            '^render_target.dispose_count=2$',
            '^render_target.final_dispose=PASS$',
            '^image.second_frame.layout_before_wrap=TRANSFER_SRC_OPTIMAL$',
            '^image.resize_first_frame.layout_before_wrap=UNDEFINED$',
            '^image.layout.reuse_transition=PASS$',
            '^image.layout.resize_reset=PASS$',
            '^image.layout.tracking=PASS$',
            '^provider.dispose_count=1$',
            '^graphite.context.dispose=PASS$',
            '^vulkan.device.dispose=PASS$',
            '^persistent.context.lifecycle=PASS$',
            '^persistent.render_target.lifecycle=PASS$',
            '^comparison=PASS$',
            '^provider.packaging=PROBE_ONLY$',
            '^renderer.adoption=OPT_IN_ONLY$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "Graphite render-path provider contract missing: $pattern"
            }
          }

      - name: Upload Graphite render-path provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-render-path-provider-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-render-path-provider-probe/build/probe/graphite-render-path-provider.txt
            compose/graphite-render-path-provider-probe/build/probe/direct-native-canvas.png
            compose/graphite-render-path-provider-probe/build/probe/graphite-provider-offscreen.png
            compose/graphite-render-path-provider-probe/build/probe/graphite-provider-composited.png
            compose/graphite-render-path-provider-probe/build/probe/graphite-provider-second-frame.png
            compose/graphite-render-path-provider-probe/build/probe/graphite-provider-resized-frame.png
            compose/graphite-render-path-provider-probe/build/probe/graphite-render-path-provider-dependencies.txt
            compose/graphite-render-path-provider-probe/build/probe/windows-vulkan-environment.txt
          if-no-files-found: warn
          retention-days: 90


  windows-compose-offscreen-integration-probe:
    needs:
      - windows-graphite-offscreen-composite-probe
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      GRAPHITE_SKIKO_VERSION: '0.153.0'

    steps:
      - name: Checkout Compose offscreen integration probe source
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download Graphite offscreen composite evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-offscreen-composite-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: offscreen-evidence

      - name: Resolve and verify Graphite offscreen input
        shell: pwsh
        run: |
          $png = @(Get-ChildItem -Path "offscreen-evidence" -Filter "graphite-offscreen.png" -File -Recurse)
          $result = @(Get-ChildItem -Path "offscreen-evidence" -Filter "graphite-offscreen-composite.txt" -File -Recurse)

          if ($png.Count -ne 1) {
            Get-ChildItem -Path "offscreen-evidence" -File -Recurse | Select-Object -ExpandProperty FullName
            throw "Expected exactly one graphite-offscreen.png, found $($png.Count)"
          }
          if ($result.Count -ne 1) {
            Get-ChildItem -Path "offscreen-evidence" -File -Recurse | Select-Object -ExpandProperty FullName
            throw "Expected exactly one graphite-offscreen-composite.txt, found $($result.Count)"
          }

          foreach ($pattern in @(
            '^result=OFFSCREEN_COMPOSITE_CAPABLE$',
            '^graphite.snapshot=PASS$',
            '^graphite.readback=PASS$',
            '^offscreen.transfer=CPU_READBACK$',
            '^offscreen.composite=PASS$',
            '^comparison=PASS$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
            if (!(Select-String -Path $result[0].FullName -Pattern $pattern -Quiet)) {
              throw "Upstream Graphite offscreen contract missing: $pattern"
            }
          }

          "GRAPHITE_COMPOSE_SOURCE_PNG=$($png[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "source.png=$($png[0].FullName)"
          "source.contract=$($result[0].FullName)"

      - name: Set up JDK 21 Compose integration runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Compose integration Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Compose 1.13 and Skiko 0.153 dependency set
        working-directory: compose
        shell: pwsh
        run: |
          $probeDir = "graphite-compose-offscreen-integration-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-compose-offscreen-integration-dependencies.txt"

          .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" dependencyInsight --dependency skiko-awt --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" dependencies --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.compose\.desktop:desktop-jvm-windows-x64:1\.13\.0-alpha01",
            "org\.jetbrains\.skiko:skiko-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "Compose offscreen integration dependency evidence missing: $pattern"
            }
          }

      - name: Run Compose offscreen integration probe
        working-directory: compose
        shell: pwsh
        env:
          GRAPHITE_COMPOSE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-compose-offscreen-integration-probe\build\probe
        run: .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" clean run --stacktrace

      - name: Verify Compose offscreen integration contract
        shell: pwsh
        run: |
          $result = "compose\graphite-compose-offscreen-integration-probe\build\probe\graphite-compose-offscreen-integration.txt"
          $actual = "compose\graphite-compose-offscreen-integration-probe\build\probe\compose-native-canvas.png"
          $expected = "compose\graphite-compose-offscreen-integration-probe\build\probe\compose-native-canvas-expected.png"

          foreach ($file in @($result, $actual, $expected)) {
            if (!(Test-Path $file)) { throw "Compose offscreen integration evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=COMPOSE_OFFSCREEN_INTEGRATION_CAPABLE$',
            '^source.provenance=GRAPHITE_OFFSCREEN_ARTIFACT$',
            '^offscreen.transfer=CPU_READBACK$',
            '^compose.version=1\.13\.0-alpha01$',
            '^skiko.version=0\.153\.0$',
            '^compose.window=STARTED$',
            '^compose.canvas=PASS$',
            '^compose.native_canvas=PASS$',
            '^compose.native_canvas.draw_image=PASS$',
            '^compose.screen_capture=PASS$',
            '^comparison=PASS$',
            '^production.renderer.switch=NOT_IMPLEMENTED$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "Compose offscreen integration contract missing: $pattern"
            }
          }

      - name: Upload Compose offscreen integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-compose-offscreen-integration-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-compose-offscreen-integration-probe/build/probe/graphite-compose-offscreen-integration.txt
            compose/graphite-compose-offscreen-integration-probe/build/probe/compose-native-canvas.png
            compose/graphite-compose-offscreen-integration-probe/build/probe/compose-native-canvas-expected.png
            compose/graphite-compose-offscreen-integration-probe/build/probe/graphite-compose-offscreen-integration-dependencies.txt
          if-no-files-found: warn
          retention-days: 90

