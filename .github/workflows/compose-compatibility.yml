          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-offscreen-composite-probe\build\probe
        run: |
          .\gradlew.bat -p graphite-offscreen-composite-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean graphiteOffscreenCompositeProbe --stacktrace

      - name: Verify Graphite offscreen composite contract
        shell: pwsh
        run: |
