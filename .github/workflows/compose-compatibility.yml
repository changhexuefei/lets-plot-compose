          $composite = "compose\graphite-offscreen-composite-probe\build\probe\graphite-offscreen-composited.png"

          foreach ($file in @($result, $software, $graphite, $composite)) {
            if (!(Test-Path $file)) { throw "Graphite offscreen composite evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=OFFSCREEN_COMPOSITE_CAPABLE$',
            '^renderer.entry=PlotCanvasDrawable -> paintOnSkiaCanvas -> Graphite offscreen -> CPU readback -> Skia Image -> raster Canvas$',
            '^bridge.source=DesktopSkiaPaintBridge\.kt$',
            '^bridge.density=1\.25$',
            '^bridge.plot_position=24\.0,20\.0$',
            '^software.paint_bridge=PASS$',
            '^graphite.paint_bridge=PASS$',
            '^plot.drawable.paint=PASS$',
            '^graphite.submit=PASS$',
            '^graphite.snapshot=PASS$',
            '^graphite.readback=PASS$',
            '^offscreen.transfer=CPU_READBACK$',
            '^software.composite=PASS$',
            '^offscreen.composite=PASS$',
            '^comparison=PASS$',
            '^compose.native_canvas.integration=SIMULATED_RASTER_CANVAS$',
            '^production.renderer.switch=NOT_IMPLEMENTED$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
