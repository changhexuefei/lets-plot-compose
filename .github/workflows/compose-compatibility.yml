            if (!(Test-Path $file)) { throw "PlotPanel Graphite shadow evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=COMPOSE_PLOTPANEL_PERSISTENT_GRAPHITE_SHADOW_CAPABLE$',
            '^compose\.plotpanel\.production_artifact=PASS$',
            '^production\.renderer\.default=NATIVE_CANVAS$',
            '^feature_flag\.value=graphite-offscreen$',
            '^provider\.binding=INTERNAL_REGISTRY_REFLECTION$',
            '^provider\.install=PASS$',
            '^compose\.window=STARTED$',
            '^compose\.plotpanel=PASS$',
            '^compose\.plotpanel\.render_path=OFFSCREEN_COMPOSITE$',
            '^compose\.plotpanel\.initial_capture=PASS$',
            '^compose\.plotpanel\.resize=PASS$',
            '^compose\.plotpanel\.resized_capture=PASS$',
            '^compose\.recomposition\.after_resize=PASS$',
            '^graphite\.context\.create_count=1$',
            '^render_target\.reuse=PASS$',
            '^render_target\.resize=PASS$',
            '^image\.layout\.reuse_transition=PASS$',
            '^provider\.registration\.dispose=PASS$',
            '^provider\.dispose_count=1$',
            '^persistent\.context\.lifecycle=PASS$',
            '^persistent\.render_target\.lifecycle=PASS$',
            '^compose\.plotpanel\.dispose=PASS$',
            '^provider\.packaging=PROBE_ONLY$',
            '^renderer\.adoption=SHADOW_OPT_IN_ONLY$',
            '^public\.api\.change=NONE$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "PlotPanel Graphite shadow contract missing: $pattern"
            }
          }

      - name: Upload PlotPanel persistent Graphite shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-plotpanel-shadow-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-plotpanel-shadow-probe/build/probe/graphite-plotpanel-shadow.txt
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-initial.png
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-resized.png
            compose/graphite-plotpanel-shadow-probe/build/probe/graphite-plotpanel-shadow-dependencies.txt
            compose/graphite-plotpanel-shadow-probe/build/probe/windows-vulkan-environment.txt
          if-no-files-found: warn
          retention-days: 90


  graphite-renderer-readiness-gate:
    needs:
      - windows-compose-1-13-skiko-0-153-recompile-smoke
      - windows-graphite-canvas-rendering-probe
      - windows-graphite-plot-drawable-probe
      - windows-graphite-paint-bridge-probe
      - windows-graphite-offscreen-composite-probe
      - windows-compose-offscreen-integration-probe
      - windows-graphite-render-path-provider-probe
      - windows-plotpanel-persistent-graphite-shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Skiko 0.153 recompile evidence
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-compose-recompiled-compose-1.13.0-alpha01-skiko-0.153.0-${{ github.sha }}
          path: evidence/recompile

      - name: Download Graphite Canvas evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-canvas-rendering-skiko-0.153.0-${{ github.sha }}
          path: evidence/canvas

      - name: Download Graphite PlotCanvasDrawable evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-plot-drawable-skiko-0.153.0-${{ github.sha }}
          path: evidence/plot-drawable

      - name: Download Graphite paint bridge evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-paint-bridge-skiko-0.153.0-${{ github.sha }}
          path: evidence/paint-bridge

      - name: Download Graphite offscreen composite evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-offscreen-composite-skiko-0.153.0-${{ github.sha }}
          path: evidence/offscreen-composite

      - name: Download Compose offscreen integration evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-compose-offscreen-integration-skiko-0.153.0-${{ github.sha }}
          path: evidence/compose-offscreen

      - name: Download desktop render path contract evidence
        uses: actions/download-artifact@v4
        with:
          name: desktop-render-path-contract-${{ github.sha }}
          path: evidence/render-path

      - name: Download Graphite render-path provider evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-render-path-provider-skiko-0.153.0-${{ github.sha }}
          path: evidence/graphite-provider

      - name: Download PlotPanel persistent Graphite shadow evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-plotpanel-shadow-skiko-0.153.0-${{ github.sha }}
          path: evidence/plotpanel-shadow

      - name: Verify Graphite frontend readiness chain
        shell: bash
        run: |
          set -euo pipefail

          find_one() {
            local root="$1"
            local name="$2"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $name under $root, found ${#matches[@]}" >&2
              find "$root" -maxdepth 8 -type f -print | sort >&2
              exit 1
            fi

            printf '%s\n' "${matches[0]}"
          }

          recompile="$(find_one evidence/recompile baseline-manifest.txt)"
          canvas="$(find_one evidence/canvas graphite-canvas-rendering.txt)"
          plot="$(find_one evidence/plot-drawable graphite-plot-drawable.txt)"
          bridge="$(find_one evidence/paint-bridge graphite-paint-bridge.txt)"
          offscreen="$(find_one evidence/offscreen-composite graphite-offscreen-composite.txt)"
          compose_offscreen="$(find_one evidence/compose-offscreen graphite-compose-offscreen-integration.txt)"
          render_path="$(find_one evidence/render-path desktop-render-path.txt)"
          graphite_provider="$(find_one evidence/graphite-provider graphite-render-path-provider.txt)"
          plotpanel_shadow="$(find_one evidence/plotpanel-shadow graphite-plotpanel-shadow.txt)"

          echo "Resolved readiness evidence:"
          printf '  recompile=%s\n  canvas=%s\n  plot=%s\n  bridge=%s\n  offscreen=%s\n  compose_offscreen=%s\n  render_path=%s\n  graphite_provider=%s\n  plotpanel_shadow=%s\n' \
            "$recompile" "$canvas" "$plot" "$bridge" "$offscreen" "$compose_offscreen" "$render_path" "$graphite_provider" "$plotpanel_shadow"

          require_line() {
            local file="$1"
            local expected="$2"
            if ! tr -d '\r' < "$file" | grep -Fxq "$expected"; then
              echo "Missing readiness contract in $file: $expected" >&2
              echo "--- normalized evidence: $file ---" >&2
              tr -d '\r' < "$file" >&2
              exit 1
            fi
          }

          require_line "$recompile" "probe.result=PASS"
          require_line "$recompile" "frontend.recompiled=true"
          require_line "$recompile" "frontend.recompiled.skiko=0.153.0"
          require_line "$recompile" "renderer.adoption=NOT_STARTED"

          require_line "$canvas" "result=CANVAS_RENDERING_CAPABLE"
          require_line "$canvas" "bridge.software=PASS"
          require_line "$canvas" "bridge.graphite=PASS"
          require_line "$canvas" "comparison=PASS"

          require_line "$plot" "result=PLOT_DRAWABLE_CAPABLE"
          require_line "$plot" "plot.drawable.paint=PASS"
          require_line "$plot" "graphite.submit=PASS"
          require_line "$plot" "comparison=PASS"

          require_line "$bridge" "result=PAINT_BRIDGE_CAPABLE"
          require_line "$bridge" "software.paint_bridge=PASS"
          require_line "$bridge" "graphite.paint_bridge=PASS"
          require_line "$bridge" "plotpanel.integration=PAINT_BRIDGE_ONLY"
          require_line "$bridge" "renderer.adoption=NOT_STARTED"

          require_line "$offscreen" "result=OFFSCREEN_COMPOSITE_CAPABLE"
          require_line "$offscreen" "graphite.snapshot=PASS"
          require_line "$offscreen" "graphite.readback=PASS"
          require_line "$offscreen" "offscreen.transfer=CPU_READBACK"
          require_line "$offscreen" "software.composite=PASS"
          require_line "$offscreen" "offscreen.composite=PASS"
          require_line "$offscreen" "comparison=PASS"
          require_line "$offscreen" "compose.native_canvas.integration=SIMULATED_RASTER_CANVAS"
          require_line "$offscreen" "production.renderer.switch=NOT_IMPLEMENTED"
          require_line "$offscreen" "renderer.adoption=NOT_STARTED"

          require_line "$compose_offscreen" "result=COMPOSE_OFFSCREEN_INTEGRATION_CAPABLE"
          require_line "$compose_offscreen" "source.provenance=GRAPHITE_OFFSCREEN_ARTIFACT"
          require_line "$compose_offscreen" "offscreen.transfer=CPU_READBACK"
          require_line "$compose_offscreen" "compose.window=STARTED"
          require_line "$compose_offscreen" "compose.canvas=PASS"
          require_line "$compose_offscreen" "compose.native_canvas=PASS"
          require_line "$compose_offscreen" "compose.native_canvas.draw_image=PASS"
          require_line "$compose_offscreen" "compose.screen_capture=PASS"
          require_line "$compose_offscreen" "comparison=PASS"
          require_line "$compose_offscreen" "production.renderer.switch=NOT_IMPLEMENTED"
          require_line "$compose_offscreen" "renderer.adoption=NOT_STARTED"

          require_line "$render_path" "result=FEATURE_FLAGGED_RENDER_PATH_CAPABLE"
          require_line "$render_path" "feature_flag.property=letsplot.compose.desktop.renderPath"
          require_line "$render_path" "default.path=NATIVE_CANVAS"
          require_line "$render_path" "offscreen.requested=SUPPORTED"
          require_line "$render_path" "offscreen.missing_provider=FALLBACK_NATIVE"
          require_line "$render_path" "offscreen.provider.binding=INTERNAL_REGISTRY"
          require_line "$render_path" "offscreen.provider.size_contract=PASS"
          require_line "$render_path" "offscreen.provider.raster_reference=PASS"
          require_line "$render_path" "offscreen.provider.pixel_equivalence=PASS"
          require_line "$render_path" "offscreen.provider.ownership=REGISTRATION_SAFE"
          require_line "$render_path" "offscreen.provider.stale_dispose=SAFE"
          require_line "$render_path" "offscreen.provider.dispose=REGISTRATION_OWNED"
          require_line "$render_path" "public.api.change=NONE"
          require_line "$render_path" "production.graphite_dependency=ABSENT"
          require_line "$render_path" "renderer.adoption=NOT_STARTED"
          require_line "$render_path" "tests=PASS"

          require_line "$graphite_provider" "result=GRAPHITE_RENDER_TARGET_FAILURE_RECOVERY_CAPABLE"
          require_line "$graphite_provider" "feature_flag.value=graphite-offscreen"
          require_line "$graphite_provider" "feature_flag.resolve=PASS"
          require_line "$graphite_provider" "requested.path=OFFSCREEN_COMPOSITE"
          require_line "$graphite_provider" "effective.path=OFFSCREEN_COMPOSITE"
          require_line "$graphite_provider" "provider.install=PASS"
          require_line "$graphite_provider" "provider.invoked=PASS"
          require_line "$graphite_provider" "graphite.context=CREATED"
          require_line "$graphite_provider" "graphite.context.create_count=1"
          require_line "$graphite_provider" "graphite.context.reuse=PASS"
          require_line "$graphite_provider" "graphite.context.reuse_count=22"
          require_line "$graphite_provider" "graphite.surface=CREATED"
          require_line "$graphite_provider" "graphite.submit=PASS"
          require_line "$graphite_provider" "graphite.readback=PASS"
          require_line "$graphite_provider" "provider.composite_to_target=PASS"
          require_line "$graphite_provider" "provider.registration.dispose=PASS"
          require_line "$graphite_provider" "provider.lifecycle=PERSISTENT_CONTEXT_AND_RENDER_TARGET"
          require_line "$graphite_provider" "provider.paint_count=23"
          require_line "$graphite_provider" "successful_frame.count=21"
          require_line "$graphite_provider" "failure_recovery.count=2"
          require_line "$graphite_provider" "same_size.consistency=PASS"
          require_line "$graphite_provider" "resized.consistency=PASS"
          require_line "$graphite_provider" "failure.paint.injected=PASS"
          require_line "$graphite_provider" "failure.paint.caught=PASS"
          require_line "$graphite_provider" "failure.paint.target_preserved=PASS"
          require_line "$graphite_provider" "failure.paint.layout_preserved=PASS"
          require_line "$graphite_provider" "failure.paint.recovery=PASS"
          require_line "$graphite_provider" "failure.resize.create.injected=PASS"
          require_line "$graphite_provider" "failure.resize.target_released=PASS"
          require_line "$graphite_provider" "failure.resize.caught=PASS"
          require_line "$graphite_provider" "failure.resize.no_stale_target=PASS"
          require_line "$graphite_provider" "failure.resize.recovery=PASS"
          require_line "$graphite_provider" "render_target.lifecycle=PERSISTENT_BY_SIZE"
          require_line "$graphite_provider" "render_target.create_count=2"
          require_line "$graphite_provider" "render_target.reuse=PASS"
          require_line "$graphite_provider" "render_target.reuse_count=20"
          require_line "$graphite_provider" "render_target.resize=PASS"
          require_line "$graphite_provider" "render_target.resize_count=1"
          require_line "$graphite_provider" "render_target.dispose_count=2"
          require_line "$graphite_provider" "render_target.final_dispose=PASS"
          require_line "$graphite_provider" "image.second_frame.layout_before_wrap=TRANSFER_SRC_OPTIMAL"
          require_line "$graphite_provider" "image.resize_first_frame.layout_before_wrap=UNDEFINED"
          require_line "$graphite_provider" "image.layout.reuse_transition=PASS"
          require_line "$graphite_provider" "image.layout.resize_reset=PASS"
          require_line "$graphite_provider" "image.layout.tracking=PASS"
          require_line "$graphite_provider" "provider.dispose_count=1"
          require_line "$graphite_provider" "graphite.context.dispose=PASS"
          require_line "$graphite_provider" "vulkan.device.dispose=PASS"
          require_line "$graphite_provider" "persistent.context.lifecycle=PASS"
          require_line "$graphite_provider" "persistent.render_target.lifecycle=PASS"
          require_line "$graphite_provider" "comparison=PASS"
          require_line "$graphite_provider" "provider.packaging=PROBE_ONLY"
          require_line "$graphite_provider" "renderer.adoption=OPT_IN_ONLY"

          require_line "$plotpanel_shadow" "result=COMPOSE_PLOTPANEL_PERSISTENT_GRAPHITE_SHADOW_CAPABLE"
          require_line "$plotpanel_shadow" "compose.plotpanel.production_artifact=PASS"
          require_line "$plotpanel_shadow" "production.renderer.default=NATIVE_CANVAS"
          require_line "$plotpanel_shadow" "feature_flag.value=graphite-offscreen"
          require_line "$plotpanel_shadow" "provider.binding=INTERNAL_REGISTRY_REFLECTION"
          require_line "$plotpanel_shadow" "provider.install=PASS"
          require_line "$plotpanel_shadow" "compose.window=STARTED"
          require_line "$plotpanel_shadow" "compose.plotpanel=PASS"
          require_line "$plotpanel_shadow" "compose.plotpanel.render_path=OFFSCREEN_COMPOSITE"
          require_line "$plotpanel_shadow" "compose.plotpanel.initial_capture=PASS"
          require_line "$plotpanel_shadow" "compose.plotpanel.resize=PASS"
          require_line "$plotpanel_shadow" "compose.plotpanel.resized_capture=PASS"
          require_line "$plotpanel_shadow" "compose.recomposition.after_resize=PASS"
          require_line "$plotpanel_shadow" "graphite.context.create_count=1"
          require_line "$plotpanel_shadow" "render_target.reuse=PASS"
          require_line "$plotpanel_shadow" "render_target.resize=PASS"
          require_line "$plotpanel_shadow" "image.layout.reuse_transition=PASS"
          require_line "$plotpanel_shadow" "provider.registration.dispose=PASS"
          require_line "$plotpanel_shadow" "provider.dispose_count=1"
          require_line "$plotpanel_shadow" "persistent.context.lifecycle=PASS"
          require_line "$plotpanel_shadow" "persistent.render_target.lifecycle=PASS"
          require_line "$plotpanel_shadow" "compose.plotpanel.dispose=PASS"
          require_line "$plotpanel_shadow" "provider.packaging=PROBE_ONLY"
          require_line "$plotpanel_shadow" "renderer.adoption=SHADOW_OPT_IN_ONLY"
          require_line "$plotpanel_shadow" "public.api.change=NONE"

      - name: Build Graphite renderer readiness manifest
        shell: bash
        run: |
          mkdir -p evidence/readiness
          cat > evidence/readiness/graphite-renderer-readiness.txt <<EOF
          schema=1
          result=COMPOSE_PLOTPANEL_PERSISTENT_GRAPHITE_SHADOW_CAPABLE
          platform=windows-probe-chain
          jdk=21
          compose.preview=1.13.0-alpha01
          skiko=0.153.0
          software.control=PASS
          graphite.canvas=PASS
          graphite.plot_drawable=PASS
          graphite.paint_bridge=PASS
          plotpanel.integration=PERSISTENT_GRAPHITE_SHADOW
          plotpanel.production_artifact=PASS
          plotpanel.resize=PASS
          plotpanel.recomposition=PASS
          plotpanel.dispose=PASS
          offscreen.composite=PASS
          offscreen.transfer=CPU_READBACK
          compose.native_canvas.integration=PASS
          feature_flag.path=PASS
          feature_flag.default=NATIVE_CANVAS
          offscreen.provider.binding=INTERNAL_REGISTRY
          offscreen.provider.size_contract=PASS
          offscreen.provider.raster_reference=PASS
          offscreen.provider.pixel_equivalence=PASS
          offscreen.provider.ownership=REGISTRATION_SAFE
          offscreen.provider.stale_dispose=SAFE
          offscreen.provider.dispose=REGISTRATION_OWNED
          graphite.backend.provider=PASS
          graphite.backend.feature_flag=graphite-offscreen
          graphite.backend.lifecycle=PERSISTENT_CONTEXT_AND_RENDER_TARGET
          graphite.backend.context_create_count=1
          graphite.backend.context_reuse=PASS
          graphite.backend.successful_frames=21
          graphite.backend.failure_recovery_count=2
          graphite.backend.paint_failure_recovery=PASS
          graphite.backend.resize_failure_recovery=PASS
          graphite.backend.render_target=PERSISTENT_BY_SIZE
          graphite.backend.render_target_create_count=2
          graphite.backend.render_target_reuse_count=20
          graphite.backend.render_target_resize=PASS
          graphite.backend.image_layout_tracking=PASS
          graphite.backend.dispose=PASS
          graphite.backend.packaging=PROBE_ONLY
          production.renderer.switch=NOT_IMPLEMENTED
          renderer.adoption=SHADOW_OPT_IN_ONLY
          next.required=COMPOSE_PLOTPANEL_INTERACTION_REGRESSION
          workflow.sha=${{ github.sha }}
          workflow.run_id=${{ github.run_id }}
          EOF
          cat evidence/readiness/graphite-renderer-readiness.txt

      - name: Upload Graphite renderer readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphite-renderer-readiness-${{ github.sha }}
          path: evidence/readiness/graphite-renderer-readiness.txt
          if-no-files-found: error
          retention-days: 90

