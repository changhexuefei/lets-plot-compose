name: Kotlin 2.4.20 + Compose 1.12.1 compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lets-plot-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout lets-plot-compose
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Checkout lets-plot core
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot
          ref: fix/svg-canvas-mapping-lifecycle
          path: core

      - name: Checkout lets-plot-kotlin
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot-kotlin
          ref: master
          path: kotlin-api

      - name: Set up JDK 17 build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure three-repository integration
        run: |
          echo "LETS_PLOT_CORE_BUILD=${GITHUB_WORKSPACE}/core" >> "$GITHUB_ENV"

          cat > core/local.properties <<EOF
          enable_python_package=false
          architecture=x86_64
          EOF

          cat > kotlin-api/local.properties <<EOF
          sonatype.username=
          sonatype.password=
          EOF

      - name: Publish Lets-Plot Kotlin API
        working-directory: kotlin-api
        run: ./gradlew :plot-api:publishAllPublicationsToMavenLocalRepository --stacktrace

      - name: Configure Compose build
        run: |
          cat > compose/local.properties <<EOF
          sonatype.username=
          sonatype.password=
          maven.repo.local=${GITHUB_WORKSPACE}/kotlin-api/.maven-publish-dev-repo
          EOF

      - name: Compile Compose Desktop
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileKotlinDesktop --stacktrace

      - name: Compile Compose Android
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileReleaseKotlinAndroid --stacktrace

      - name: Compile Compose WasmJS
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileKotlinWasmJs --stacktrace

      - name: Run Desktop tests
        working-directory: compose
        run: ./gradlew :lets-plot-compose:desktopTest --stacktrace

      - name: Build desktop render path contract evidence
        shell: bash
        run: |
          mkdir -p compose/lets-plot-compose/build/render-path-contract
          cat > compose/lets-plot-compose/build/render-path-contract/desktop-render-path.txt <<EOF
          schema=1
          result=FEATURE_FLAGGED_RENDER_PATH_CAPABLE
          feature_flag.property=letsplot.compose.desktop.renderPath
          default.path=NATIVE_CANVAS
          offscreen.requested=SUPPORTED
          offscreen.missing_provider=FALLBACK_NATIVE
          offscreen.provider.binding=INTERNAL_REGISTRY
          offscreen.provider.size_contract=PASS
          offscreen.provider.raster_reference=PASS
          offscreen.provider.pixel_equivalence=PASS
          offscreen.provider.ownership=REGISTRATION_SAFE
          offscreen.provider.stale_dispose=SAFE
          offscreen.provider.dispose=REGISTRATION_OWNED
          public.api.change=NONE
          production.graphite_dependency=ABSENT
          renderer.adoption=NOT_STARTED
          tests=PASS
          workflow.sha=${GITHUB_SHA}
          workflow.run_id=${GITHUB_RUN_ID}
          EOF
          cat compose/lets-plot-compose/build/render-path-contract/desktop-render-path.txt

      - name: Upload desktop render path contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-render-path-contract-${{ github.sha }}
          path: compose/lets-plot-compose/build/render-path-contract/desktop-render-path.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish Compose Desktop consumer artifacts
        working-directory: compose
        run: >
          ./gradlew
          :lets-plot-compose:publishDesktopPublicationToMavenLocalRepository
          :lets-plot-compose:publishKotlinMultiplatformPublicationToMavenLocalRepository
          --stacktrace

      - name: Assemble frontend Maven bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend-bundle/kotlin frontend-bundle/compose
          cp -R kotlin-api/.maven-publish-dev-repo/. frontend-bundle/kotlin/
          cp -R compose/.maven-publish-dev-repo/. frontend-bundle/compose/

          {
            echo "lets-plot-core.version=4.11.1-SNAPSHOT"
            echo "lets-plot-kotlin.version=4.15.1-SNAPSHOT"
            echo "lets-plot-compose.version=3.2.3-SNAPSHOT"
            echo "kotlin.version=2.4.20"
            echo "compose.version=1.12.1"
            echo "lets-plot-core.sha=$(git -C core rev-parse HEAD)"
            echo "lets-plot-kotlin.sha=$(git -C kotlin-api rev-parse HEAD)"
            echo "lets-plot-compose.sha=$(git -C compose rev-parse HEAD)"
            echo "workflow.sha=${GITHUB_SHA}"
            echo "workflow.run_id=${GITHUB_RUN_ID}"
          } > frontend-bundle/manifest.txt

      - name: Upload frontend Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: frontend-bundle
          if-no-files-found: error
          retention-days: 3

  core-jvm-bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout lets-plot core only
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot
          ref: fix/svg-canvas-mapping-lifecycle
          path: core

      - name: Set up JDK 17 Core build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Core Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Core Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure Lets-Plot core
        shell: pwsh
        run: |
          @"
          enable_python_package=false
          "@ | Set-Content -Path core/local.properties -Encoding UTF8

      - name: Publish Core JVM consumer artifacts
        working-directory: core
        shell: pwsh
        run: >
          .\gradlew.bat
          -Pbuild_release=true
          -Penable_python_package=false
          :commons:publishJvmPublicationToMavenLocalRepository
          :commons:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :canvas:publishJvmPublicationToMavenLocalRepository
          :canvas:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :datamodel:publishJvmPublicationToMavenLocalRepository
          :datamodel:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :plot-base:publishJvmPublicationToMavenLocalRepository
          :plot-base:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :plot-builder:publishJvmPublicationToMavenLocalRepository
          :plot-builder:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :plot-stem:publishJvmPublicationToMavenLocalRepository
          :plot-stem:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :plot-raster:publishJvmPublicationToMavenLocalRepository
          :plot-raster:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :jvm-package:jvm-publish-common:publishJvmPublicationToMavenLocalRepository
          :jvm-package:jvm-publish-common:publishKotlinMultiplatformPublicationToMavenLocalRepository
          :platf-awt:publishPlatf-awtPublicationToMavenLocalRepository
          :platf-batik:publishPlatf-batikPublicationToMavenLocalRepository
          :jvm-package:jvm-publish-swing:publishLetsPlotJvmSwingPublicationToMavenLocalRepository
          --stacktrace

      - name: Assemble Core Maven bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core-bundle\core | Out-Null
          Copy-Item -Recurse -Force core\.maven-publish-dev-repo\* core-bundle\core\

          @"
          lets-plot-core.version=4.11.1-SNAPSHOT
          lets-plot-core.sha=$(git -C core rev-parse HEAD)
          workflow.sha=${{ github.sha }}
          workflow.run_id=${{ github.run_id }}
          "@ | Set-Content -Path core-bundle\core-manifest.txt -Encoding UTF8

      - name: Upload Core Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: core-bundle
          if-no-files-found: error
          retention-days: 3

  windows-consumer-smoke:
    needs:
      - compose-compatibility
      - core-jvm-bundle
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SMOKE_RENDER_API: SOFTWARE
      SMOKE_BASELINE_ID: windows-jdk21-software
    steps:
      - name: Checkout standalone consumer only
        uses: actions/checkout@v4
        with:
          path: compose
          sparse-checkout: |
            consumer-smoke
            gradlew
            gradlew.bat
            gradle/wrapper
          sparse-checkout-cone-mode: false

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Set up JDK 21 consumer runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up consumer Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and run standalone consumer
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\consumer-bundle\compose
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\consumer-smoke\build\smoke
        run: .\gradlew.bat -p consumer-smoke clean classes run --stacktrace

      - name: Verify smoke summary
        shell: pwsh
        run: |
          $summary = "compose\consumer-smoke\build\smoke\smoke-summary.txt"
          if (!(Test-Path $summary)) {
            throw "Smoke summary was not created: $summary"
          }
          Get-Content $summary
          if (!(Select-String -Path $summary -Pattern "^result=PASS$" -Quiet)) {
            throw "Smoke summary does not contain result=PASS"
          }

      - name: Capture Skiko renderer dependency report
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\\consumer-bundle\\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\\consumer-bundle\\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\\consumer-bundle\\compose
        run: |
          $report = "consumer-smoke\\build\\smoke\\renderer-dependencies.txt"
          .\\gradlew.bat -p consumer-smoke dependencyInsight --dependency skiko --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          if (!(Test-Path $report)) {
            throw "Renderer dependency report was not created: $report"
          }

      - name: Build renderer baseline manifest
        shell: pwsh
        run: |
          $smokeDir = "compose\\consumer-smoke\\build\\smoke"
          $manifest = Join-Path $smokeDir "baseline-manifest.txt"
          $screenshots = @(Get-ChildItem -Path $smokeDir -Filter "*.png" | Sort-Object Name)

          if ($screenshots.Count -ne 9) {
            throw "Expected 9 baseline screenshots, found $($screenshots.Count)"
          }

          $lines = @(
            "schema=1",
            "baseline.id=$env:SMOKE_BASELINE_ID",
            "platform=windows",
            "jdk=21",
            "renderer.requested=$env:SMOKE_RENDER_API",
            "workflow.sha=${{ github.sha }}",
            "workflow.run_id=${{ github.run_id }}",
            "comparison.key=baseline.id+checkpoint.filename",
            "comparison.required_screenshots=9",
            "comparison.hash_role=provenance-only",
            "artifact.retention_days=90"
          )

          foreach ($screenshot in $screenshots) {
            $hash = (Get-FileHash -Path $screenshot.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "sha256.$($screenshot.Name)=$hash"
          }

          $lines | Set-Content -Path $manifest -Encoding UTF8
          Get-Content $manifest

      - name: Upload Windows consumer regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-skiko-baseline-${{ env.SMOKE_BASELINE_ID }}-${{ github.sha }}
          path: |
            compose/consumer-smoke/build/smoke/*.png
            compose/consumer-smoke/build/smoke/smoke-summary.txt
            compose/consumer-smoke/build/smoke/baseline-manifest.txt
            compose/consumer-smoke/build/smoke/renderer-dependencies.txt
            consumer-bundle/manifest.txt
            consumer-bundle/core-manifest.txt
          if-no-files-found: warn
          retention-days: 90


  windows-skiko-upgrade-probe:
    needs:
      - compose-compatibility
      - core-jvm-bundle
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SMOKE_RENDER_API: SOFTWARE
      SMOKE_SKIKO_VERSION: '0.153.0'
      SMOKE_BASELINE_ID: windows-jdk21-software-skiko-0.153.0
    steps:
      - name: Checkout standalone consumer only
        uses: actions/checkout@v4
        with:
          path: compose
          sparse-checkout: |
            consumer-smoke
            gradlew
            gradlew.bat
            gradle/wrapper
          sparse-checkout-cone-mode: false

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Set up JDK 21 consumer runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up probe Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Capture and verify Skiko candidate resolution
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\\consumer-bundle\\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\\consumer-bundle\\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\\consumer-bundle\\compose
        run: |
          $smokeDir = "consumer-smoke\\build\\smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $report = Join-Path $smokeDir "renderer-dependencies.txt"

          .\\gradlew.bat -p consumer-smoke dependencyInsight --dependency skiko --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report

          if (!(Test-Path $report)) {
            throw "Candidate renderer dependency report was not created: $report"
          }

          $runtimePattern = "org\.jetbrains\.skiko:skiko-awt-runtime-windows-x64:0\.153\.0"
          if (!(Select-String -Path $report -Pattern $runtimePattern -Quiet)) {
            throw "Skiko 0.153.0 Windows runtime was not resolved by the candidate consumer"
          }

      - name: Verify Compose 1.12.1 rejects Skiko 0.153.0 ABI
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\\consumer-bundle\\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\\consumer-bundle\\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\\consumer-bundle\\compose
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\\compose\\consumer-smoke\\build\\smoke
        run: |
          $smokeDir = "consumer-smoke\\build\\smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $runtimeLog = Join-Path $smokeDir "candidate-runtime.log"
          $tempRuntimeLog = Join-Path $env:RUNNER_TEMP "skiko-candidate-runtime.log"
          $compatibility = Join-Path $smokeDir "compatibility.txt"

          Remove-Item -Force -ErrorAction SilentlyContinue $tempRuntimeLog

          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            .\\gradlew.bat -p consumer-smoke classes run --stacktrace 2>&1 |
              Tee-Object -FilePath $tempRuntimeLog
            $candidateExitCode = $LASTEXITCODE
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }

          if (!(Test-Path $tempRuntimeLog)) {
            throw "Candidate runtime log was not created: $tempRuntimeLog"
          }
          Copy-Item -Force $tempRuntimeLog $runtimeLog

          if ($candidateExitCode -eq 0) {
            throw "Skiko 0.153.0 unexpectedly ran with Compose 1.12.1. Update this ABI guard to a positive runtime probe."
          }

          $knownAbiPattern = "java\.lang\.NoSuchMethodError:.*org\.jetbrains\.skiko\.SkiaLayer\.<init>"
          if (!(Select-String -Path $runtimeLog -Pattern $knownAbiPattern -Quiet)) {
            throw "Candidate failed for an unexpected reason; expected the known SkiaLayer constructor ABI mismatch."
          }

          @(
            "result=EXPECTED_INCOMPATIBLE",
            "compose.version=1.12.1",
            "compose.expected.skiko=0.150.1",
            "candidate.skiko=$env:SMOKE_SKIKO_VERSION",
            "renderer.requested=$env:SMOKE_RENDER_API",
            "failure.type=java.lang.NoSuchMethodError",
            "failure.symbol=org.jetbrains.skiko.SkiaLayer.<init>",
            "runtime.exit_code=$candidateExitCode",
            "workflow.sha=${{ github.sha }}",
            "workflow.run_id=${{ github.run_id }}"
          ) | Set-Content -Path $compatibility -Encoding UTF8

          Get-Content $compatibility

          # The candidate Gradle process is expected to exit 1 for this exact ABI mismatch.
          # Only reach exit 0 after both the dependency version and failure signature were verified.
          exit 0

      - name: Build Skiko ABI evidence manifest
        shell: pwsh
        run: |
          $smokeDir = "compose\\consumer-smoke\\build\\smoke"
          $manifest = Join-Path $smokeDir "baseline-manifest.txt"

          @(
            "schema=1",
            "baseline.id=$env:SMOKE_BASELINE_ID",
            "probe.type=skiko-abi-compatibility",
            "probe.result=EXPECTED_INCOMPATIBLE",
            "platform=windows",
            "jdk=21",
            "renderer.requested=$env:SMOKE_RENDER_API",
            "compose.version=1.12.1",
            "compose.expected.skiko=0.150.1",
            "skiko.override=$env:SMOKE_SKIKO_VERSION",
            "comparison.control=windows-jdk21-software",
            "comparison.visual_evidence=not-applicable-before-runtime-linkage",
            "workflow.sha=${{ github.sha }}",
            "workflow.run_id=${{ github.run_id }}",
            "artifact.retention_days=90"
          ) | Set-Content -Path $manifest -Encoding UTF8

          Get-Content $manifest

      - name: Upload Skiko ABI compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skiko-abi-compatibility-compose-1.12.1-skiko-${{ env.SMOKE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/consumer-smoke/build/smoke/compatibility.txt
            compose/consumer-smoke/build/smoke/baseline-manifest.txt
            compose/consumer-smoke/build/smoke/renderer-dependencies.txt
            compose/consumer-smoke/build/smoke/candidate-runtime.log
            consumer-bundle/manifest.txt
            consumer-bundle/core-manifest.txt
          if-no-files-found: warn
          retention-days: 90


  windows-compose-1-13-preview-probe:
    needs:
      - compose-compatibility
      - core-jvm-bundle
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SMOKE_RENDER_API: SOFTWARE
      SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
      SMOKE_EXPECTED_SKIKO_VERSION: 0.152.0-alpha02
      SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
      SMOKE_TOOLTIP_STABLE_BASELINE: 'true'
      SMOKE_TOOLTIP_DWELL_MS: '700'
      SMOKE_TOOLTIP_X_RADIUS: '160'
      SMOKE_TOOLTIP_Y_RADIUS: '120'
      LETS_PLOT_POINTER_TRACE: 'true'
      SMOKE_BASELINE_ID: windows-jdk21-software-compose-1.13.0-alpha01
    steps:
      - name: Checkout preview source and consumer
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Set up JDK 21 preview runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up preview Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure preview frontend source build
        shell: pwsh
        run: |
          $props = Get-Content compose\gradle.properties
          $props = $props -replace '^compose\.version=.*$', "compose.version=$env:SMOKE_COMPOSE_VERSION"
          $props | Set-Content compose\gradle.properties -Encoding UTF8

          $repoRoot = "${{ github.workspace }}" -replace '\\', '/'
          @"
          sonatype.username=
          sonatype.password=
          maven.repo.local=$repoRoot/consumer-bundle/core,$repoRoot/consumer-bundle/kotlin
          "@ | Set-Content -Path compose\local.properties -Encoding UTF8

          Select-String -Path compose\gradle.properties -Pattern '^compose\.version='

      - name: Publish Compose preview Desktop artifact
        working-directory: compose
        shell: pwsh
        run: >
          .\gradlew.bat
          :lets-plot-compose:clean
          :lets-plot-compose:publishDesktopPublicationToMavenLocalRepository
          --stacktrace

      - name: Run standalone consumer with Compose preview
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose\.maven-publish-dev-repo
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\consumer-smoke\build\smoke
        run: .\gradlew.bat -p consumer-smoke clean classes run --stacktrace

      - name: Verify preview smoke summary
        shell: pwsh
        run: |
          $summary = "compose\consumer-smoke\build\smoke\smoke-summary.txt"
          if (!(Test-Path $summary)) {
            throw "Preview smoke summary was not created: $summary"
          }
          Get-Content $summary
          if (!(Select-String -Path $summary -Pattern "^result=PASS$" -Quiet)) {
            throw "Preview smoke summary does not contain result=PASS"
          }
          if (!(Select-String -Path $summary -Pattern "^renderApi=SOFTWARE$" -Quiet)) {
            throw "Preview smoke did not use the SOFTWARE control renderer"
          }

      - name: Capture and verify official Compose Skiko pair
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose\.maven-publish-dev-repo
        run: |
          $report = "consumer-smoke\build\smoke\renderer-dependencies.txt"
          "=== Compose Desktop resolution ===" | Set-Content -Path $report -Encoding UTF8
          .\gradlew.bat -p consumer-smoke dependencyInsight --dependency desktop-jvm-windows-x64 --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append
          "=== Skiko resolution ===" | Add-Content -Path $report
          .\gradlew.bat -p consumer-smoke dependencyInsight --dependency skiko --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          $composePattern = "org\.jetbrains\.compose\.desktop:desktop-jvm-windows-x64:1\.13\.0-alpha01"
          if (!(Select-String -Path $report -Pattern $composePattern -Quiet)) {
            throw "Compose Desktop 1.13.0-alpha01 was not resolved by the preview consumer"
          }

          $skikoCorePattern = "org\.jetbrains\.skiko:skiko:0\.152\.0-alpha02"
          if (!(Select-String -Path $report -Pattern $skikoCorePattern -Quiet)) {
            throw "Expected official Skiko core 0.152.0-alpha02 was not resolved"
          }

          $skikoAwtPattern = "org\.jetbrains\.skiko:skiko-awt:0\.152\.0-alpha02"
          if (!(Select-String -Path $report -Pattern $skikoAwtPattern -Quiet)) {
            throw "Expected official Skiko AWT 0.152.0-alpha02 was not resolved"
          }

          if (Select-String -Path $report -Pattern "org\.jetbrains\.skiko:.*:0\.153\.0" -Quiet) {
            throw "Preview probe unexpectedly resolved Skiko 0.153.0"
          }

      - name: Build Compose preview baseline manifest
        shell: pwsh
        run: |
          $smokeDir = "compose\consumer-smoke\build\smoke"
          $manifest = Join-Path $smokeDir "baseline-manifest.txt"
          $screenshots = @(Get-ChildItem -Path $smokeDir -Filter "*.png" | Sort-Object Name)

          if ($screenshots.Count -ne 9) {
            throw "Expected 9 preview baseline screenshots, found $($screenshots.Count)"
          }

          $lines = @(
            "schema=1",
            "baseline.id=$env:SMOKE_BASELINE_ID",
            "probe.type=compose-preview-readiness",
            "probe.result=PASS",
            "platform=windows",
            "jdk=21",
            "renderer.requested=$env:SMOKE_RENDER_API",
            "compose.version=$env:SMOKE_COMPOSE_VERSION",
            "frontend.compiled.compose.version=$env:SMOKE_COMPOSE_VERSION",
            "frontend.artifact=$env:SMOKE_LETS_PLOT_COMPOSE_ARTIFACT",
            "skiko.expected=$env:SMOKE_EXPECTED_SKIKO_VERSION",
            "skiko.modules=skiko,skiko-awt",
            "skiko.override=none",
            "comparison.control=windows-jdk21-software",
            "comparison.key=checkpoint.filename",
            "comparison.required_screenshots=9",
            "comparison.hash_role=provenance-only",
            "workflow.sha=${{ github.sha }}",
            "workflow.run_id=${{ github.run_id }}",
            "artifact.retention_days=90"
          )

          foreach ($screenshot in $screenshots) {
            $hash = (Get-FileHash -Path $screenshot.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "sha256.$($screenshot.Name)=$hash"
          }

          $lines | Set-Content -Path $manifest -Encoding UTF8
          Get-Content $manifest

      - name: Upload Compose preview regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-skiko-baseline-${{ env.SMOKE_BASELINE_ID }}-${{ github.sha }}
          path: |
            compose/consumer-smoke/build/smoke/*.png
            compose/consumer-smoke/build/smoke/smoke-summary.txt
            compose/consumer-smoke/build/smoke/baseline-manifest.txt
            compose/consumer-smoke/build/smoke/renderer-dependencies.txt
            consumer-bundle/manifest.txt
            consumer-bundle/core-manifest.txt
          if-no-files-found: warn
          retention-days: 90

  windows-compose-1-13-skiko-0-153-recompile-smoke:
    needs:
      - compose-compatibility
      - core-jvm-bundle
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SMOKE_RENDER_API: SOFTWARE
      SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
      SMOKE_SKIKO_VERSION: '0.153.0'
      SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
      SMOKE_TOOLTIP_STABLE_BASELINE: 'true'
      SMOKE_TOOLTIP_DWELL_MS: '700'
      SMOKE_TOOLTIP_X_RADIUS: '160'
      SMOKE_TOOLTIP_Y_RADIUS: '120'
      LETS_PLOT_POINTER_TRACE: 'true'
      SMOKE_BASELINE_ID: windows-jdk21-software-compose-1.13.0-alpha01-skiko-0.153.0-recompiled
    steps:
      - name: Checkout source and consumer
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Set up JDK 21 recompile runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up recompile Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure Compose 1.13 and coherent Skiko 0.153 build
        shell: pwsh
        run: |
          $props = Get-Content compose\gradle.properties
          $props = $props -replace '^compose\.version=.*$', "compose.version=$env:SMOKE_COMPOSE_VERSION"
          $props | Set-Content compose\gradle.properties -Encoding UTF8

          $repoRoot = "${{ github.workspace }}" -replace '\\', '/'
          @"
          sonatype.username=
          sonatype.password=
          maven.repo.local=$repoRoot/consumer-bundle/core,$repoRoot/consumer-bundle/kotlin
          "@ | Set-Content -Path compose\local.properties -Encoding UTF8

          @'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.skiko') {
                          details.useVersion(System.getenv('SMOKE_SKIKO_VERSION'))
                          details.because('Graphite readiness probe recompiles Lets-Plot Compose against coherent Skiko 0.153')
                      }
                  }
              }
          }
          '@ | Set-Content -Path compose\skiko-0.153-override.init.gradle -Encoding UTF8

          Select-String -Path compose\gradle.properties -Pattern '^compose\.version='
          Get-Content compose\skiko-0.153-override.init.gradle

      - name: Verify frontend compile classpath uses Skiko 0.153
        working-directory: compose
        shell: pwsh
        run: |
          $reportDir = "build"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $report = Join-Path $reportDir "skiko-0.153-frontend-dependencies.txt"
          .\gradlew.bat -I skiko-0.153-override.init.gradle :lets-plot-compose:dependencyInsight --dependency skiko --configuration desktopCompileClasspath --console=plain |
            Tee-Object -FilePath $report

          $skikoCorePattern = "org\.jetbrains\.skiko:skiko:0\.153\.0"
          if (!(Select-String -Path $report -Pattern $skikoCorePattern -Quiet)) {
            throw "Lets-Plot Compose frontend compile classpath did not resolve Skiko core 0.153.0"
          }
          $skikoAwtPattern = "org\.jetbrains\.skiko:skiko-awt:0\.153\.0"
          if (!(Select-String -Path $report -Pattern $skikoAwtPattern -Quiet)) {
            throw "Lets-Plot Compose frontend compile classpath did not resolve Skiko AWT 0.153.0"
          }

      - name: Recompile and publish Lets-Plot Compose Desktop against Skiko 0.153
        working-directory: compose
        shell: pwsh
        run: >
          .\gradlew.bat
          -I skiko-0.153-override.init.gradle
          :lets-plot-compose:clean
          :lets-plot-compose:publishDesktopPublicationToMavenLocalRepository
          --stacktrace

      - name: Run full consumer smoke against recompiled frontend
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose\.maven-publish-dev-repo
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\consumer-smoke\build\smoke
        run: .\gradlew.bat -p consumer-smoke clean classes run --stacktrace

      - name: Verify full recompile smoke contract
        shell: pwsh
        run: |
          $smokeDir = "compose\consumer-smoke\build\smoke"
          $summary = Join-Path $smokeDir "smoke-summary.txt"
          if (!(Test-Path $summary)) {
            throw "Recompiled frontend smoke summary was not created: $summary"
          }
          Get-Content $summary
          if (!(Select-String -Path $summary -Pattern "^result=PASS$" -Quiet)) {
            throw "Recompiled frontend smoke did not pass"
          }
          if (!(Select-String -Path $summary -Pattern "^renderApi=SOFTWARE$" -Quiet)) {
            throw "Recompiled frontend smoke did not use SOFTWARE control renderer"
          }

          $screenshots = @(Get-ChildItem -Path $smokeDir -Filter "*.png" | Sort-Object Name)
          if ($screenshots.Count -ne 9) {
            throw "Expected 9 recompile smoke screenshots, found $($screenshots.Count)"
          }

      - name: Capture and verify recompiled runtime dependencies
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose\.maven-publish-dev-repo
        run: |
          $report = "consumer-smoke\build\smoke\renderer-dependencies.txt"
          "=== Compose Desktop resolution ===" | Set-Content -Path $report -Encoding UTF8
          .\gradlew.bat -p consumer-smoke dependencyInsight --dependency desktop-jvm-windows-x64 --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append
          "=== Skiko resolution ===" | Add-Content -Path $report
          .\gradlew.bat -p consumer-smoke dependencyInsight --dependency skiko --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.compose\.desktop:desktop-jvm-windows-x64:1\.13\.0-alpha01",
            "org\.jetbrains\.skiko:skiko:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-awt-runtime-all:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "Recompiled frontend runtime dependency evidence missing: $pattern"
            }
          }

      - name: Build recompile readiness manifest
        shell: pwsh
        run: |
          $smokeDir = "compose\consumer-smoke\build\smoke"
          $manifest = Join-Path $smokeDir "baseline-manifest.txt"
          $screenshots = @(Get-ChildItem -Path $smokeDir -Filter "*.png" | Sort-Object Name)

          $lines = @(
            "schema=1",
            "baseline.id=$env:SMOKE_BASELINE_ID",
            "probe.type=lets-plot-compose-skiko-recompile-smoke",
            "probe.result=PASS",
            "platform=windows",
            "jdk=21",
            "renderer.requested=$env:SMOKE_RENDER_API",
            "compose.version=$env:SMOKE_COMPOSE_VERSION",
            "frontend.recompiled=true",
            "frontend.recompiled.skiko=$env:SMOKE_SKIKO_VERSION",
            "runtime.skiko=$env:SMOKE_SKIKO_VERSION",
            "runtime.skiko.artifact=skiko-awt-runtime-all",
            "graphite.runtime=NOT_INCLUDED",
            "graphite.renderer=NOT_ATTEMPTED",
            "renderer.adoption=NOT_STARTED",
            "comparison.required_screenshots=9",
            "workflow.sha=${{ github.sha }}",
            "workflow.run_id=${{ github.run_id }}",
            "artifact.retention_days=90"
          )

          foreach ($screenshot in $screenshots) {
            $hash = (Get-FileHash -Path $screenshot.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "sha256.$($screenshot.Name)=$hash"
          }

          $lines | Set-Content -Path $manifest -Encoding UTF8
          Get-Content $manifest

      - name: Upload Skiko 0.153 recompile smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lets-plot-compose-recompiled-compose-1.13.0-alpha01-skiko-0.153.0-${{ github.sha }}
          path: |
            compose/consumer-smoke/build/smoke/*.png
            compose/consumer-smoke/build/smoke/smoke-summary.txt
            compose/consumer-smoke/build/smoke/baseline-manifest.txt
            compose/consumer-smoke/build/smoke/renderer-dependencies.txt
            compose/build/skiko-0.153-frontend-dependencies.txt
            consumer-bundle/manifest.txt
            consumer-bundle/core-manifest.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload recompiled Compose Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: lets-plot-compose-recompiled-maven-${{ github.sha }}
          path: compose/.maven-publish-dev-repo
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  windows-graphite-canvas-rendering-probe:
    needs:
      - core-jvm-bundle
      - windows-compose-1-13-skiko-0-153-recompile-smoke
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      GRAPHITE_SKIKO_VERSION: '0.153.0'
      GRAPHITE_LWJGL_VERSION: '3.4.3'

    steps:
      - name: Checkout probe source
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download recompiled Compose Maven repository
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-compose-recompiled-maven-${{ github.sha }}
          path: compose-recompiled

      - name: Set up JDK 21 Graphite Canvas runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Graphite Canvas Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Capture Windows Vulkan environment
        shell: pwsh
        run: |
          $probeDir = "compose\graphite-canvas-rendering-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "windows-vulkan-environment.txt"
          "os=$([System.Environment]::OSVersion.VersionString)" | Set-Content $report
          "vulkan.loader.exists=$(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")" | Add-Content $report
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterRAM |
            Format-List | Out-String | Add-Content $report
          Get-Content $report

      - name: Configure browser SwiftShader Vulkan ICD
        shell: pwsh
        run: |
          $probeDir = "compose\graphite-canvas-rendering-probe\build\probe"
          $report = Join-Path $probeDir "windows-vulkan-environment.txt"
          $roots = @(
            "$env:ProgramFiles\Google\Chrome\Application",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application",
            "$env:ProgramFiles\Microsoft\Edge\Application",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $icd = $roots |
            ForEach-Object { Get-ChildItem -Path $_ -Filter 'vk_swiftshader_icd.json' -File -Recurse -ErrorAction SilentlyContinue } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $icd) {
            $json = Get-Content $icd.FullName -Raw | ConvertFrom-Json
            $libraryPath = $json.ICD.library_path
            $resolvedLibrary = Join-Path $icd.Directory.FullName $libraryPath
            if (!(Test-Path $resolvedLibrary)) {
              throw "Browser SwiftShader ICD manifest found, but its library is missing: $resolvedLibrary"
            }

            $directDir = Join-Path $env:RUNNER_TEMP 'letsplot-swiftshader-vulkan-canvas'
            New-Item -ItemType Directory -Force -Path $directDir | Out-Null
            $directDll = Join-Path $directDir 'vulkan-1.dll'
            Copy-Item -Path $resolvedLibrary -Destination $directDll -Force

            "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_PROVIDER=browser-swiftshader-direct" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_DIRECT_DLL=$directDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            "vulkan.provider=browser-swiftshader-direct" | Add-Content $report
            "vulkan.icd=$($icd.FullName)" | Add-Content $report
            "vulkan.icd.library=$resolvedLibrary" | Add-Content $report
            "vulkan.direct.dll=$directDll" | Add-Content $report
          } else {
            "GRAPHITE_VULKAN_PROVIDER=system" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "vulkan.provider=system" | Add-Content $report
            "vulkan.icd=not-found" | Add-Content $report
          }

          Get-Content $report

      - name: Verify Graphite Canvas dependency set
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
        run: |
          $probeDir = "graphite-canvas-rendering-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-canvas-dependencies.txt"

          .\gradlew.bat -p graphite-canvas-rendering-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency lets-plot-compose-desktop --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-canvas-rendering-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency skiko-graphite --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.lets-plot:lets-plot-compose-desktop:3\.2\.3-SNAPSHOT",
            "org\.jetbrains\.skiko:skiko-graphite-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-graphite-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "Graphite Canvas dependency evidence missing: $pattern"
            }
          }

      - name: Run Graphite Canvas rendering probe
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-canvas-rendering-probe\build\probe
        run: |
          .\gradlew.bat -p graphite-canvas-rendering-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean graphiteCanvasRenderingProbe --stacktrace

      - name: Verify Graphite Canvas contract
        shell: pwsh
        run: |
          $result = "compose\graphite-canvas-rendering-probe\build\probe\graphite-canvas-rendering.txt"
          $software = "compose\graphite-canvas-rendering-probe\build\probe\software-skia-context2d.png"
          $graphite = "compose\graphite-canvas-rendering-probe\build\probe\graphite-skia-context2d.png"

          foreach ($file in @($result, $software, $graphite)) {
            if (!(Test-Path $file)) { throw "Graphite Canvas evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=CANVAS_RENDERING_CAPABLE$',
            '^adapter=SkiaContext2d$',
            '^bridge.entry=DesktopSkiaPaintBridgeKt.paintOnSkiaCanvas$',
            '^bridge.software=PASS$',
            '^bridge.graphite=PASS$',
            '^software.baseline=PASS$',
            '^graphite.skiaContext2d=PAINTED$',
            '^graphite.submit=PASS$',
            '^graphite.readback=PASS$',
            '^scene.axes=PASS$',
            '^scene.path=PASS$',
            '^scene.points=PASS$',
            '^scene.text=PASS$',
            '^comparison=PASS$',
            '^plotpanel.integration=NOT_ATTEMPTED$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "Graphite Canvas contract missing: $pattern"
            }
          }

      - name: Upload Graphite Canvas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-canvas-rendering-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-canvas-rendering-probe/build/probe/graphite-canvas-rendering.txt
            compose/graphite-canvas-rendering-probe/build/probe/software-skia-context2d.png
            compose/graphite-canvas-rendering-probe/build/probe/graphite-skia-context2d.png
            compose/graphite-canvas-rendering-probe/build/probe/graphite-canvas-dependencies.txt
            compose/graphite-canvas-rendering-probe/build/probe/windows-vulkan-environment.txt
          if-no-files-found: warn
          retention-days: 90

