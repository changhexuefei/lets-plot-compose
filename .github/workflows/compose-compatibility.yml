        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
        run: |
          $probeDir = "graphite-plot-drawable-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-plot-drawable-dependencies.txt"

          .\gradlew.bat -p graphite-plot-drawable-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency lets-plot-kotlin --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-plot-drawable-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency lets-plot-compose-desktop --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append
          .\gradlew.bat -p graphite-plot-drawable-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency skiko-graphite --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.lets-plot:lets-plot-kotlin",
            "org\.jetbrains\.lets-plot:lets-plot-compose-desktop:3\.2\.3-SNAPSHOT",
            "org\.jetbrains\.skiko:skiko-graphite-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-graphite-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "PlotCanvasDrawable Graphite dependency evidence missing: $pattern"
            }
          }

      - name: Run Graphite PlotCanvasDrawable probe
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-plot-drawable-probe\build\probe
        run: |
          .\gradlew.bat -p graphite-plot-drawable-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean graphitePlotDrawableProbe --stacktrace

      - name: Verify Graphite PlotCanvasDrawable contract
        shell: pwsh
        run: |
          $result = "compose\graphite-plot-drawable-probe\build\probe\graphite-plot-drawable.txt"
          $software = "compose\graphite-plot-drawable-probe\build\probe\software-plot-drawable.png"
          $graphite = "compose\graphite-plot-drawable-probe\build\probe\graphite-plot-drawable.png"

          foreach ($file in @($result, $software, $graphite)) {
            if (!(Test-Path $file)) { throw "Graphite PlotCanvasDrawable evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=PLOT_DRAWABLE_CAPABLE$',
            '^renderer.entry=PlotCanvasDrawable\.paint\(SkiaContext2d\)$',
            '^plot.spec.processing=PASS$',
            '^plot.drawable.update=PASS$',
            '^plot.drawable.paint=PASS$',
            '^software.baseline=PASS$',
            '^graphite.plotDrawable=PAINTED$',
            '^graphite.submit=PASS$',
            '^graphite.readback=PASS$',
            '^plot.axes_text=PASS$',
            '^plot.points=PASS$',
            '^comparison=PASS$',
            '^plotpanel.integration=NOT_ATTEMPTED$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "Graphite PlotCanvasDrawable contract missing: $pattern"
            }
          }

      - name: Upload Graphite PlotCanvasDrawable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-plot-drawable-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-plot-drawable-probe/build/probe/graphite-plot-drawable.txt
            compose/graphite-plot-drawable-probe/build/probe/software-plot-drawable.png
            compose/graphite-plot-drawable-probe/build/probe/graphite-plot-drawable.png
            compose/graphite-plot-drawable-probe/build/probe/graphite-plot-drawable-dependencies.txt
            compose/graphite-plot-drawable-probe/build/probe/windows-vulkan-environment.txt
          if-no-files-found: warn
          retention-days: 90

