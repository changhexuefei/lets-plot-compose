name: Kotlin 2.4.20 + Compose 1.12.1 compatibility

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout lets-plot-compose
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Checkout upgraded lets-plot core
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot
          ref: chore/kotlin-2.4.20
          path: core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Publish upgraded core to local Maven repository
        working-directory: core
        run: |
          ./gradlew \
            -Pbuild_release=true \
            -Penable_python_package=false \
            -Parchitecture=x86_64 \
            publishLetsPlotCoreModulesToMavenLocalRepository \
            --stacktrace

      - name: Configure Compose build to use upgraded core
        working-directory: compose
        run: |
          cat > local.properties <<EOF
          sonatype.username=
          sonatype.password=
          maven.repo.local=${GITHUB_WORKSPACE}/core/.maven-publish-dev-repo
          EOF

      - name: Compile Compose Desktop
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileKotlinDesktop --stacktrace

      - name: Compile Compose Android
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileReleaseKotlinAndroid --stacktrace

      - name: Compile Compose WasmJS
        working-directory: compose
        run: ./gradlew :lets-plot-compose:compileKotlinWasmJs --stacktrace

      - name: Run Desktop tests
        working-directory: compose
        run: ./gradlew :lets-plot-compose:desktopTest --stacktrace
