        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Compose 1.13 and Skiko 0.153 dependency set
        working-directory: compose
        shell: pwsh
        run: |
          $probeDir = "graphite-compose-offscreen-integration-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-compose-offscreen-integration-dependencies.txt"

          .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" dependencyInsight --dependency skiko-awt --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" dependencies --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.compose\.desktop:desktop-jvm-windows-x64:1\.13\.0-alpha01",
            "org\.jetbrains\.skiko:skiko-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "Compose offscreen integration dependency evidence missing: $pattern"
            }
          }

      - name: Run Compose offscreen integration probe
        working-directory: compose
        shell: pwsh
        env:
          GRAPHITE_COMPOSE_PROBE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-compose-offscreen-integration-probe\build\probe
        run: .\gradlew.bat -p graphite-compose-offscreen-integration-probe "-PgraphiteSkikoVersion=$env:GRAPHITE_SKIKO_VERSION" clean run --stacktrace

      - name: Verify Compose offscreen integration contract
        shell: pwsh
        run: |
          $result = "compose\graphite-compose-offscreen-integration-probe\build\probe\graphite-compose-offscreen-integration.txt"
          $actual = "compose\graphite-compose-offscreen-integration-probe\build\probe\compose-native-canvas.png"
          $expected = "compose\graphite-compose-offscreen-integration-probe\build\probe\compose-native-canvas-expected.png"

          foreach ($file in @($result, $actual, $expected)) {
            if (!(Test-Path $file)) { throw "Compose offscreen integration evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=COMPOSE_OFFSCREEN_INTEGRATION_CAPABLE$',
            '^source.provenance=GRAPHITE_OFFSCREEN_ARTIFACT$',
            '^offscreen.transfer=CPU_READBACK$',
            '^compose.version=1\.13\.0-alpha01$',
            '^skiko.version=0\.153\.0$',
            '^compose.window=STARTED$',
            '^compose.canvas=PASS$',
            '^compose.native_canvas=PASS$',
            '^compose.native_canvas.draw_image=PASS$',
            '^compose.screen_capture=PASS$',
            '^comparison=PASS$',
            '^production.renderer.switch=NOT_IMPLEMENTED$',
            '^renderer.adoption=NOT_STARTED$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "Compose offscreen integration contract missing: $pattern"
            }
          }

      - name: Upload Compose offscreen integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-compose-offscreen-integration-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-compose-offscreen-integration-probe/build/probe/graphite-compose-offscreen-integration.txt
            compose/graphite-compose-offscreen-integration-probe/build/probe/compose-native-canvas.png
            compose/graphite-compose-offscreen-integration-probe/build/probe/compose-native-canvas-expected.png
            compose/graphite-compose-offscreen-integration-probe/build/probe/graphite-compose-offscreen-integration-dependencies.txt
          if-no-files-found: warn
          retention-days: 90

  windows-plotpanel-persistent-graphite-shadow:
    needs:
      - windows-graphite-render-path-provider-probe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      GRAPHITE_SKIKO_VERSION: '0.153.0'
      GRAPHITE_LWJGL_VERSION: '3.4.3'

    steps:
      - name: Checkout PlotPanel Graphite shadow probe source
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Download frontend Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-frontend-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download Core Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-core-maven-${{ github.sha }}
          path: consumer-bundle

      - name: Download recompiled Compose Maven repository
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-compose-recompiled-maven-${{ github.sha }}
          path: compose-recompiled

      - name: Set up JDK 21 PlotPanel Graphite shadow runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up PlotPanel Graphite shadow Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure browser SwiftShader Vulkan ICD
        shell: pwsh
        run: |
          $probeDir = "compose\graphite-plotpanel-shadow-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "windows-vulkan-environment.txt"
          "os=$([System.Environment]::OSVersion.VersionString)" | Set-Content $report
          "vulkan.loader.exists=$(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")" | Add-Content $report

          $roots = @(
            "$env:ProgramFiles\Google\Chrome\Application",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application",
            "$env:ProgramFiles\Microsoft\Edge\Application",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $icd = $roots |
            ForEach-Object { Get-ChildItem -Path $_ -Filter 'vk_swiftshader_icd.json' -File -Recurse -ErrorAction SilentlyContinue } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -ne $icd) {
            $json = Get-Content $icd.FullName -Raw | ConvertFrom-Json
            $resolvedLibrary = Join-Path $icd.Directory.FullName $json.ICD.library_path
            if (!(Test-Path $resolvedLibrary)) {
              throw "Browser SwiftShader ICD manifest found, but its library is missing: $resolvedLibrary"
            }

            $directDir = Join-Path $env:RUNNER_TEMP 'letsplot-swiftshader-vulkan-plotpanel-shadow'
            New-Item -ItemType Directory -Force -Path $directDir | Out-Null
            $directDll = Join-Path $directDir 'vulkan-1.dll'
            Copy-Item -Path $resolvedLibrary -Destination $directDll -Force

            "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_PROVIDER=browser-swiftshader-direct" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "GRAPHITE_VULKAN_DIRECT_DLL=$directDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            "vulkan.provider=browser-swiftshader-direct" | Add-Content $report
            "vulkan.icd=$($icd.FullName)" | Add-Content $report
            "vulkan.icd.library=$resolvedLibrary" | Add-Content $report
            "vulkan.direct.dll=$directDll" | Add-Content $report
          } else {
            "GRAPHITE_VULKAN_PROVIDER=system" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "vulkan.provider=system" | Add-Content $report
            "vulkan.icd=not-found" | Add-Content $report
          }

          Get-Content $report

      - name: Verify PlotPanel Graphite shadow dependency set
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
        run: |
          $probeDir = "graphite-plotpanel-shadow-probe\build\probe"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $report = Join-Path $probeDir "graphite-plotpanel-shadow-dependencies.txt"

          .\gradlew.bat -p graphite-plotpanel-shadow-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency lets-plot-compose-desktop --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report
          .\gradlew.bat -p graphite-plotpanel-shadow-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" dependencyInsight --dependency skiko-graphite-awt --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $report -Append

          foreach ($pattern in @(
            "org\.jetbrains\.lets-plot:lets-plot-compose-desktop:3\.2\.3-SNAPSHOT",
            "org\.jetbrains\.skiko:skiko-graphite-awt:0\.153\.0",
            "org\.jetbrains\.skiko:skiko-graphite-awt-runtime-windows-x64:0\.153\.0"
          )) {
            if (!(Select-String -Path $report -Pattern $pattern -Quiet)) {
              throw "PlotPanel Graphite shadow dependency evidence missing: $pattern"
            }
          }

      - name: Run real PlotPanel persistent Graphite shadow probe
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_SHADOW_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-plotpanel-shadow-probe\build\probe
        run: |
          .\gradlew.bat -p graphite-plotpanel-shadow-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean run --stacktrace

      - name: Verify PlotPanel Graphite interaction stress contract
        shell: pwsh
        run: |
          $result = "compose\graphite-plotpanel-shadow-probe\build\probe\graphite-plotpanel-shadow.txt"
          $initial = "compose\graphite-plotpanel-shadow-probe\build\probe\plotpanel-graphite-initial.png"
          $wheel = "compose\graphite-plotpanel-shadow-probe\build\probe\plotpanel-graphite-wheel-zoom.png"
          $pan = "compose\graphite-plotpanel-shadow-probe\build\probe\plotpanel-graphite-drag-pan.png"
          $resized = "compose\graphite-plotpanel-shadow-probe\build\probe\plotpanel-graphite-resized.png"

          foreach ($file in @($result, $initial, $wheel, $pan, $resized)) {
            if (!(Test-Path $file)) { throw "PlotPanel Graphite shadow evidence missing: $file" }
          }

          Get-Content $result
          foreach ($pattern in @(
            '^result=COMPOSE_PLOTPANEL_INTERACTION_STRESS_REGRESSION_CAPABLE$',
            '^compose\.plotpanel\.production_artifact=PASS$',
            '^production\.renderer\.default=NATIVE_CANVAS$',
            '^feature_flag\.value=graphite-offscreen$',
            '^provider\.binding=INTERNAL_REGISTRY_REFLECTION$',
            '^provider\.install=PASS$',
            '^compose\.window=STARTED$',
            '^compose\.plotpanel=PASS$',
            '^compose\.plotpanel\.render_path=OFFSCREEN_COMPOSITE$',
            '^compose\.plotpanel\.initial_capture=PASS$',
            '^interaction\.input=AWT_ROBOT_REAL_WINDOW$',
            '^interaction\.default\.wheel_zoom=ENABLED$',
            '^interaction\.default\.drag_pan=ENABLED$',
            '^interaction\.wheel_zoom\.robot=PASS$',
            '^interaction\.wheel_zoom\.state_change=PASS$',
            '^interaction\.wheel_zoom\.repaint=PASS$',
            '^interaction\.wheel_zoom\.capture=PASS$',
            '^interaction\.wheel_zoom\.override_count=[1-9][0-9]*$',
            '^interaction\.drag_pan\.robot=PASS$',
            '^interaction\.drag_pan\.state_change=PASS$',
            '^interaction\.drag_pan\.repaint=PASS$',
            '^interaction\.drag_pan\.capture=PASS$',
            '^interaction\.drag_pan\.override_count=[1-9][0-9]*$',
            '^interaction\.state\.after_resize=PRESERVED$',
            '^stress\.pre_resize\.rounds=4$',
            '^stress\.pre_resize=PASS$',
            '^stress\.post_resize\.rounds=4$',
            '^stress\.post_resize=PASS$',
            '^stress\.total\.rounds=8$',
            '^stress\.total\.interactions=16$',
            '^stress\.state_changes=16$',
            '^stress\.repaints=16$',
            '^stress\.context_reuse=PASS$',
            '^stress\.render_target\.reuse=PASS$',
            '^stress\.render_target\.resize_boundary=PASS$',
            '^compose\.plotpanel\.resize=PASS$',
            '^compose\.plotpanel\.resized_capture=PASS$',
            '^compose\.recomposition\.after_resize=PASS$',
            '^graphite\.context\.create_count=1$',
            '^render_target\.reuse=PASS$',
            '^render_target\.resize=PASS$',
            '^image\.layout\.reuse_transition=PASS$',
            '^figure_model\.dispose=PASS$',
            '^provider\.registration\.dispose=PASS$',
            '^provider\.dispose_count=1$',
            '^persistent\.context\.lifecycle=PASS$',
            '^persistent\.render_target\.lifecycle=PASS$',
            '^compose\.plotpanel\.dispose=PASS$',
            '^interaction\.regression=PASS$',
            '^interaction\.stress=PASS$',
            '^provider\.packaging=PROBE_ONLY$',
            '^renderer\.adoption=SHADOW_OPT_IN_ONLY$',
            '^public\.api\.change=NONE$'
          )) {
            if (!(Select-String -Path $result -Pattern $pattern -Quiet)) {
              throw "PlotPanel Graphite shadow contract missing: $pattern"
            }
          }

      - name: Run paired PlotPanel native and Graphite performance evidence
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          PLOT_PERFORMANCE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-plotpanel-shadow-probe\build\performance
        run: |
          .\gradlew.bat -p graphite-plotpanel-shadow-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            runPerformanceNative --stacktrace

          .\gradlew.bat -p graphite-plotpanel-shadow-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            runPerformanceGraphite --stacktrace

      - name: Verify and compare PlotPanel performance evidence
        shell: pwsh
        run: |
          $dir = "compose\graphite-plotpanel-shadow-probe\build\performance"
          $nativeFile = Join-Path $dir "plotpanel-performance-native.txt"
          $graphiteFile = Join-Path $dir "plotpanel-performance-graphite.txt"
          $comparisonFile = Join-Path $dir "plotpanel-performance-comparison.txt"

          foreach ($file in @($nativeFile, $graphiteFile)) {
            if (!(Test-Path $file)) {
              throw "PlotPanel performance evidence missing: $file"
            }
          }

          function Require-Pattern([string]$file, [string]$pattern) {
            if (!(Select-String -Path $file -Pattern $pattern -Quiet)) {
              Get-Content $file
              throw "Performance evidence contract missing from $file : $pattern"
            }
          }

          foreach ($pattern in @(
            '^result=PLOTPANEL_PERFORMANCE_SAMPLE_CAPABLE$',
            '^render\.path=NATIVE_CANVAS$',
            '^measurement\.kind=REAL_WINDOW_INPUT_TO_VISIBLE_CHANGE$',
            '^measurement\.policy=OBSERVATIONAL_ONLY$',
            '^pan\.measurement=FINAL_STAGED_DRAG_STEP_TO_VISIBLE_CHANGE$',
            '^warmup\.rounds=2$',
            '^measured\.rounds=4$',
            '^measured\.interactions=8$',
            '^interaction\.state_changes=8$',
            '^interaction\.visible_changes=8$',
            '^measurement\.samples=8$',
            '^native\.path=PASS$',
            '^figure_model\.dispose=PASS$',
            '^renderer\.adoption=SHADOW_OPT_IN_ONLY$'
          )) {
            Require-Pattern $nativeFile $pattern
          }

          foreach ($pattern in @(
            '^result=PLOTPANEL_PERFORMANCE_SAMPLE_CAPABLE$',
            '^render\.path=OFFSCREEN_COMPOSITE$',
            '^measurement\.kind=REAL_WINDOW_INPUT_TO_VISIBLE_CHANGE$',
            '^measurement\.policy=OBSERVATIONAL_ONLY$',
            '^pan\.measurement=FINAL_STAGED_DRAG_STEP_TO_VISIBLE_CHANGE$',
            '^warmup\.rounds=2$',
            '^measured\.rounds=4$',
            '^measured\.interactions=8$',
            '^interaction\.state_changes=8$',
            '^interaction\.visible_changes=8$',
            '^measurement\.samples=8$',
            '^provider\.install=PASS$',
            '^graphite\.context\.create_count=1$',
            '^render_target\.create_count=1$',
            '^render_target\.reuse_count=[1-9][0-9]*$',
            '^graphite\.context_reuse=PASS$',
            '^render_target\.reuse=PASS$',
            '^graphite\.cleanup=PASS$',
            '^figure_model\.dispose=PASS$',
            '^renderer\.adoption=SHADOW_OPT_IN_ONLY$'
          )) {
            Require-Pattern $graphiteFile $pattern
          }

          function Read-Kv([string]$file) {
            $values = @{}
            foreach ($line in Get-Content $file) {
              if ($line -match '^([^=]+)=(.*)$') {
                $values[$matches[1]] = $matches[2]
              }
            }
            return $values
          }

          $native = Read-Kv $nativeFile
          $graphite = Read-Kv $graphiteFile
          $culture = [System.Globalization.CultureInfo]::InvariantCulture

          $nativeMedian = [double]::Parse($native["latency.overall.median_ms"], $culture)
          $nativeP95 = [double]::Parse($native["latency.overall.p95_ms"], $culture)
          $nativeMax = [double]::Parse($native["latency.overall.max_ms"], $culture)
          $graphiteMedian = [double]::Parse($graphite["latency.overall.median_ms"], $culture)
          $graphiteP95 = [double]::Parse($graphite["latency.overall.p95_ms"], $culture)
          $graphiteMax = [double]::Parse($graphite["latency.overall.max_ms"], $culture)

          foreach ($value in @($nativeMedian, $nativeP95, $nativeMax, $graphiteMedian, $graphiteP95, $graphiteMax)) {
            if ($value -le 0 -or [double]::IsNaN($value) -or [double]::IsInfinity($value)) {
              throw "Invalid performance latency sample: $value"
            }
          }

          $medianRatio = $graphiteMedian / $nativeMedian
          $p95Ratio = $graphiteP95 / $nativeP95
          $format = {
            param([double]$value)
            [string]::Format($culture, "{0:F3}", $value)
          }

          @"
          schema=1
          result=COMPOSE_PLOTPANEL_NATIVE_GRAPHITE_PERFORMANCE_EVIDENCE_CAPABLE
          measurement.kind=REAL_WINDOW_INPUT_TO_VISIBLE_CHANGE
          measurement.policy=OBSERVATIONAL_ONLY
          runner.scope=SAME_WINDOWS_JOB_SEPARATE_JVMS
          native.samples=8
          graphite.samples=8
          native.median_ms=$(& $format $nativeMedian)
          native.p95_ms=$(& $format $nativeP95)
          native.max_ms=$(& $format $nativeMax)
          graphite.median_ms=$(& $format $graphiteMedian)
          graphite.p95_ms=$(& $format $graphiteP95)
          graphite.max_ms=$(& $format $graphiteMax)
          graphite_to_native.median_ratio=$(& $format $medianRatio)
          graphite_to_native.p95_ratio=$(& $format $p95Ratio)
          comparison.superiority_gate=NONE
          production.renderer.default=NATIVE_CANVAS
          renderer.adoption=SHADOW_OPT_IN_ONLY
          public.api.change=NONE
          "@ | Set-Content -Path $comparisonFile -Encoding UTF8

          Get-Content $nativeFile
          Get-Content $graphiteFile
          Get-Content $comparisonFile

      - name: Upload PlotPanel native and Graphite performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotpanel-native-graphite-performance-${{ github.sha }}
          path: |
            compose/graphite-plotpanel-shadow-probe/build/performance/plotpanel-performance-native.txt
            compose/graphite-plotpanel-shadow-probe/build/performance/plotpanel-performance-graphite.txt
            compose/graphite-plotpanel-shadow-probe/build/performance/plotpanel-performance-comparison.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Publish probe-only Graphite runtime bundle
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
        run: |
          .\gradlew.bat -p graphite-runtime-package-probe `
            "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" `
            "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" `
            clean publishRuntimeBundlePublicationToProbeRepository --stacktrace

      - name: Verify Graphite runtime compatibility matrix
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          GRAPHITE_COMPATIBILITY_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\compatibility
        run: |
          .\gradlew.bat -p graphite-runtime-package-probe "-PskikoVersion=$env:GRAPHITE_SKIKO_VERSION" "-PlwjglVersion=$env:GRAPHITE_LWJGL_VERSION" graphiteRuntimeCompatibilityProbe --stacktrace
          $manifest = "graphite-runtime-package-probe\build\compatibility\graphite-runtime-compatibility-matrix.txt"
          if (!(Test-Path $manifest)) { throw "Graphite runtime compatibility matrix evidence was not created" }
          foreach ($line in @(
            'result=COMPOSE_PLOTPANEL_GRAPHITE_RUNTIME_COMPATIBILITY_GATE_EVIDENCE_CAPABLE',
            'verified.os=Windows',
            'verified.arch=x86_64',
            'verified.jdk=21',
            'verified.compose=1.13.0-alpha01',
            'verified.skiko=0.153.0',
            'verified.profile=WINDOWS_X64_JDK21_GRAPHITE_0_153',
            'verified.activation=ALLOW',
            'unverified.activation=BLOCK',
            'case.unsupported_os=UNSUPPORTED_OS',
            'case.unsupported_arch=UNSUPPORTED_ARCH',
            'case.unverified_java=UNVERIFIED_JAVA',
            'case.marker_schema=FRONTEND_MARKER_SCHEMA_MISMATCH',
            'case.frontend_not_ready=FRONTEND_NOT_GRAPHITE_READY',
            'case.compose_mismatch=COMPOSE_VERSION_MISMATCH',
            'case.skiko_mismatch=SKIKO_VERSION_MISMATCH',
            'case.profile_mismatch=COMPATIBILITY_PROFILE_MISMATCH',
            'production.renderer.default=NATIVE_CANVAS',
            'renderer.adoption=EXPERIMENTAL_OPT_IN',
            'public.api.change=NONE'
          )) {
            if (!(Select-String -Path $manifest -Pattern ("^" + [regex]::Escape($line) + "$") -Quiet)) {
              Get-Content $manifest
              throw "Graphite runtime compatibility evidence missing: $line"
            }
          }

      - name: Upload Graphite runtime compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: graphite-runtime-compatibility-${{ github.sha }}
          path: compose/graphite-runtime-package-probe/build/compatibility/graphite-runtime-compatibility-matrix.txt
          if-no-files-found: error
          retention-days: 90
      - name: Verify Graphite runtime packaging boundary
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
          SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
        run: |
          $evidenceDir = "graphite-runtime-package-probe\build\evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null

          $runtimeRepo = (Resolve-Path "graphite-runtime-package-probe\build\repo").Path
          $artifactDir = Join-Path $runtimeRepo "org\jetbrains\lets-plot\probe\lets-plot-compose-graphite-runtime-windows-x64-probe\0.153.0-PROBE"
          $pom = Join-Path $artifactDir "lets-plot-compose-graphite-runtime-windows-x64-probe-0.153.0-PROBE.pom"
          $module = Join-Path $artifactDir "lets-plot-compose-graphite-runtime-windows-x64-probe-0.153.0-PROBE.module"
          $jar = Join-Path $artifactDir "lets-plot-compose-graphite-runtime-windows-x64-probe-0.153.0-PROBE.jar"

          foreach ($file in @($pom, $module, $jar)) {
            if (!(Test-Path $file)) {
              throw "Graphite runtime bundle publication is incomplete: $file"
            }
          }

          if (Select-String -Path "settings.gradle.kts" -Pattern 'graphite-runtime-package-probe' -Quiet) {
            throw "Probe-only Graphite runtime bundle must not be included in the production root build"
          }

          foreach ($pattern in @(
            '<artifactId>skiko-awt</artifactId>',
            '<artifactId>skiko-awt-runtime-windows-x64</artifactId>',
            '<artifactId>skiko-graphite-awt</artifactId>',
            '<artifactId>skiko-graphite-awt-runtime-windows-x64</artifactId>',
            '<artifactId>lwjgl-vulkan</artifactId>'
          )) {
            if (!(Select-String -Path $pom -Pattern $pattern -Quiet)) {
              Get-Content $pom
              throw "Graphite runtime bundle POM is missing: $pattern"
            }
          }

          $defaultReport = Join-Path $evidenceDir "default-runtime-dependencies.txt"
          Remove-Item Env:LETS_PLOT_GRAPHITE_RUNTIME_REPO -ErrorAction SilentlyContinue
          Remove-Item Env:SMOKE_GRAPHITE_RUNTIME_ARTIFACT -ErrorAction SilentlyContinue

          .\gradlew.bat -p consumer-smoke dependencies --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $defaultReport

          if (Select-String -Path $defaultReport -Pattern 'skiko-graphite-awt|lwjgl-vulkan|lets-plot-compose-graphite-runtime-windows-x64-probe' -Quiet) {
            throw "Default consumer unexpectedly resolved Graphite/Vulkan runtime dependencies"
          }

          if (!(Select-String -Path $defaultReport -Pattern 'org\.jetbrains\.compose\.desktop:desktop-jvm-windows-x64:1\.13\.0-alpha01' -Quiet)) {
            throw "Default packaging probe did not resolve Compose Desktop 1.13.0-alpha01"
          }

          if (!(Select-String -Path $defaultReport -Pattern 'org\.jetbrains\.skiko:skiko-awt:0\.152\.0-alpha02' -Quiet)) {
            throw "Default packaging probe did not preserve the official Compose preview Skiko baseline"
          }

          $env:LETS_PLOT_GRAPHITE_RUNTIME_REPO = $runtimeRepo
          $env:SMOKE_GRAPHITE_RUNTIME_ARTIFACT = "org.jetbrains.lets-plot.probe:lets-plot-compose-graphite-runtime-windows-x64-probe:0.153.0-PROBE"

          $optInReport = Join-Path $evidenceDir "opt-in-runtime-dependencies.txt"
          .\gradlew.bat -p consumer-smoke dependencies --configuration runtimeClasspath --console=plain |
            Tee-Object -FilePath $optInReport

          foreach ($pattern in @(
            'org\.jetbrains\.lets-plot\.probe:lets-plot-compose-graphite-runtime-windows-x64-probe:0\.153\.0-PROBE',
            'org\.jetbrains\.skiko:skiko-awt:[^\r\n]*0\.153\.0',
            'org\.jetbrains\.skiko:skiko-awt-runtime-windows-x64:[^\r\n]*0\.153\.0',
            'org\.jetbrains\.skiko:skiko-graphite-awt:0\.153\.0',
            'org\.jetbrains\.skiko:skiko-graphite-awt-runtime-windows-x64:0\.153\.0',
            'org\.lwjgl:lwjgl-vulkan:3\.4\.3'
          )) {
            if (!(Select-String -Path $optInReport -Pattern $pattern -Quiet)) {
              Get-Content $optInReport
              throw "Opt-in Graphite runtime dependency evidence missing: $pattern"
            }
          }

          $manifest = Join-Path $evidenceDir "graphite-runtime-packaging.txt"
          @"
          schema=1
          result=COMPOSE_PLOTPANEL_GRAPHITE_RUNTIME_PACKAGING_EVIDENCE_CAPABLE
          artifact.coordinate=org.jetbrains.lets-plot.probe:lets-plot-compose-graphite-runtime-windows-x64-probe:0.153.0-PROBE
          artifact.scope=EXPLICIT_OPT_IN
          artifact.platform=windows-x64
          artifact.publish=PASS
          artifact.pom=PASS
          artifact.gradle_module_metadata=PASS
          artifact.root_build_membership=ABSENT
          default.consumer.graphite_runtime=ABSENT
          default.consumer.lwjgl_vulkan=ABSENT
          default.consumer.skiko=0.152.0-alpha02
          opt_in.consumer.runtime_bundle=PRESENT
          opt_in.consumer.skiko=0.153.0
          opt_in.consumer.graphite=0.153.0
          opt_in.consumer.lwjgl_vulkan=3.4.3
          production.desktop.graphite_dependency=ABSENT
          production.renderer.default=NATIVE_CANVAS
          runtime.provider.activation=EXPLICIT_OFFSCREEN_BOOTSTRAP
          renderer.adoption=SHADOW_OPT_IN_ONLY
          public.api.change=NONE
          "@ | Set-Content -Path $manifest -Encoding UTF8

          Get-Content $manifest

      - name: Verify missing optional runtime falls back to Native Canvas
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
          SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
          SMOKE_RENDER_API: SOFTWARE
          SMOKE_DESKTOP_RENDER_PATH: graphite-offscreen
          SMOKE_TOOLTIP_STABLE_BASELINE: 'true'
          SMOKE_TOOLTIP_DWELL_MS: '700'
          SMOKE_TOOLTIP_X_RADIUS: '160'
          SMOKE_TOOLTIP_Y_RADIUS: '120'
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\activation\fallback
        run: |
          Remove-Item Env:LETS_PLOT_GRAPHITE_RUNTIME_REPO -ErrorAction SilentlyContinue
          Remove-Item Env:SMOKE_GRAPHITE_RUNTIME_ARTIFACT -ErrorAction SilentlyContinue
          .\gradlew.bat -p consumer-smoke clean run --stacktrace

      - name: Verify opt-in runtime auto-activates persistent Graphite provider
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          LETS_PLOT_GRAPHITE_RUNTIME_REPO: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\repo
          SMOKE_GRAPHITE_RUNTIME_ARTIFACT: org.jetbrains.lets-plot.probe:lets-plot-compose-graphite-runtime-windows-x64-probe:0.153.0-PROBE
          SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
          SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
          SMOKE_RENDER_API: SOFTWARE
          SMOKE_DESKTOP_RENDER_PATH: graphite-offscreen
          SMOKE_TOOLTIP_STABLE_BASELINE: 'true'
          SMOKE_TOOLTIP_DWELL_MS: '700'
          SMOKE_TOOLTIP_X_RADIUS: '160'
          SMOKE_TOOLTIP_Y_RADIUS: '120'
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\activation\opt-in
        run: .\gradlew.bat -p consumer-smoke clean run --stacktrace

      - name: Verify installed Graphite runtime paint failure falls back to Native
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\consumer-bundle\core
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\consumer-bundle\kotlin
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose-recompiled
          LETS_PLOT_GRAPHITE_RUNTIME_REPO: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\repo
          SMOKE_GRAPHITE_RUNTIME_ARTIFACT: org.jetbrains.lets-plot.probe:lets-plot-compose-graphite-runtime-windows-x64-probe:0.153.0-PROBE
          SMOKE_COMPOSE_VERSION: 1.13.0-alpha01
          SMOKE_LETS_PLOT_COMPOSE_ARTIFACT: lets-plot-compose-desktop
          SMOKE_RENDER_API: SOFTWARE
          SMOKE_DESKTOP_RENDER_PATH: graphite-offscreen
          SMOKE_GRAPHITE_FAIL_PAINT_ONCE: 'true'
          SMOKE_TOOLTIP_STABLE_BASELINE: 'true'
          SMOKE_TOOLTIP_DWELL_MS: '700'
          SMOKE_TOOLTIP_X_RADIUS: '160'
          SMOKE_TOOLTIP_Y_RADIUS: '120'
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\graphite-runtime-package-probe\build\activation\failure-fallback
        run: .\gradlew.bat -p consumer-smoke clean run --stacktrace

      - name: Verify Graphite runtime provider activation contract
        working-directory: compose
        shell: pwsh
        run: |
          $activationDir = "graphite-runtime-package-probe\build\activation"
          $fallbackSummary = Join-Path $activationDir "fallback\smoke-summary.txt"
          $optInSummary = Join-Path $activationDir "opt-in\smoke-summary.txt"
          $failureSummary = Join-Path $activationDir "failure-fallback\smoke-summary.txt"
          $manifest = Join-Path $activationDir "graphite-runtime-provider-activation.txt"
          $failureManifest = Join-Path $activationDir "graphite-runtime-failure-fallback.txt"
          $jarEntries = Join-Path $activationDir "runtime-jar-entries.txt"

          foreach ($file in @($fallbackSummary, $optInSummary, $failureSummary)) {
            if (!(Test-Path $file)) {
              throw "Runtime activation smoke summary missing: $file"
            }
          }

          function Require-Pattern([string]$file, [string]$pattern) {
            if (!(Select-String -Path $file -Pattern $pattern -Quiet)) {
              Get-Content $file
              throw "Runtime activation contract missing from $file : $pattern"
            }
          }

          foreach ($pattern in @(
            '^result=PASS$',
            '^desktop\.renderPath\.requested=graphite-offscreen$',
            '^graphite\.runtime\.activation=ABSENT$',
            '^graphite\.runtime\.backend=ABSENT$'
          )) {
            Require-Pattern $fallbackSummary $pattern
          }

          foreach ($pattern in @(
            '^result=PASS$',
            '^desktop\.renderPath\.requested=graphite-offscreen$',
            '^graphite\.runtime\.activation=ACTIVE$',
            '^graphite\.runtime\.backend=PERSISTENT_GRAPHITE_VULKAN$',
            '^graphite\.runtime\.compatibility=PASS$',
            '^graphite\.runtime\.compatibility\.reason=VERIFIED_BASELINE$',
            '^graphite\.runtime\.compatibility\.compose=1\.13\.0-alpha01$',
            '^graphite\.runtime\.compatibility\.skiko=0\.153\.0$',
            '^graphite\.runtime\.compatibility\.profile=WINDOWS_X64_JDK21_GRAPHITE_0_153$',
            '^graphite\.runtime\.compatibility\.java=21$'
          )) {
            Require-Pattern $optInSummary $pattern
          }

          foreach ($pattern in @(
            '^result=PASS$',
            '^desktop\.renderPath\.requested=graphite-offscreen$',
            '^graphite\.runtime\.activation=ACTIVE$',
            '^graphite\.runtime\.backend=PERSISTENT_GRAPHITE_VULKAN$',
            '^graphite\.runtime\.compatibility=PASS$',
            '^graphite\.runtime\.compatibility\.reason=VERIFIED_BASELINE$',
            '^graphite\.runtime\.compatibility\.compose=1\.13\.0-alpha01$',
            '^graphite\.runtime\.compatibility\.skiko=0\.153\.0$',
            '^graphite\.runtime\.compatibility\.profile=WINDOWS_X64_JDK21_GRAPHITE_0_153$',
            '^graphite\.runtime\.compatibility\.java=21$',
            '^desktop\.offscreen\.failure=java\.lang\.IllegalStateException$',
            '^desktop\.offscreen\.failureCount=1$',
            '^graphite\.runtime\.injectedFailure=TRIGGERED$',
            '^graphite\.runtime\.paintAttempts=1$',
            '^graphite\.runtime\.contextCreated=YES$',
            '^graphite\.runtime\.targetCreated=YES$',
            '^graphite\.runtime\.disposeCount=1$',
            '^graphite\.runtime\.cleanup=PASS$'
          )) {
            Require-Pattern $failureSummary $pattern
          }

          $runtimeJar = Get-ChildItem "graphite-runtime-package-probe\build\repo\org\jetbrains\lets-plot\probe\lets-plot-compose-graphite-runtime-windows-x64-probe\0.153.0-PROBE" -Filter "*.jar" | Select-Object -First 1
          if ($null -eq $runtimeJar) {
            throw "Optional Graphite runtime jar was not published"
          }

          & jar tf $runtimeJar.FullName | Set-Content -Path $jarEntries -Encoding UTF8

          foreach ($pattern in @(
            'org/jetbrains/letsPlot/compose/graphite/runtime/GraphiteRuntimeBootstrap.class',
            'probe/PersistentGraphiteShadowBackend.class'
          )) {
            if (!(Select-String -Path $jarEntries -Pattern $pattern -Quiet)) {
              Get-Content $jarEntries
              throw "Optional runtime jar is missing activation/backend class: $pattern"
            }
          }

          @"
          schema=1
          result=COMPOSE_PLOTPANEL_GRAPHITE_RUNTIME_PROVIDER_ACTIVATION_EVIDENCE_CAPABLE
          request.path=graphite-offscreen
          bootstrap.trigger=EXPLICIT_OFFSCREEN_REQUEST_ONLY
          bootstrap.attempt=ONCE
          missing_runtime.activation=ABSENT
          missing_runtime.fallback_native=PASS
          missing_runtime.consumer_smoke=PASS
          opt_in_runtime.activation=ACTIVE
          opt_in_runtime.backend=PERSISTENT_GRAPHITE_VULKAN
          opt_in_runtime.compatibility=PASS
          opt_in_runtime.compatibility_reason=VERIFIED_BASELINE
          opt_in_runtime.compatibility_compose=1.13.0-alpha01
          opt_in_runtime.compatibility_skiko=0.153.0
          opt_in_runtime.compatibility_profile=WINDOWS_X64_JDK21_GRAPHITE_0_153
          opt_in_runtime.compatibility_jdk=21
          opt_in_runtime.consumer_smoke=PASS
          opt_in_runtime.full_interaction_smoke=PASS
          runtime.jar.bootstrap=PRESENT
          runtime.jar.shared_backend=PRESENT
          production.renderer.default=NATIVE_CANVAS
          production.desktop.graphite_dependency=ABSENT
          renderer.adoption=SHADOW_OPT_IN_ONLY
          public.api.change=NONE
          "@ | Set-Content -Path $manifest -Encoding UTF8

          @"
          schema=1
          result=COMPOSE_PLOTPANEL_GRAPHITE_RUNTIME_FAILURE_FALLBACK_EVIDENCE_CAPABLE
          request.path=graphite-offscreen
          failure.stage=POST_GPU_RESOURCE_INITIALIZATION_PRE_SUBMIT
          failure.type=java.lang.IllegalStateException
          failure.count=1
          provider.paint_attempts=1
          provider.quarantined=PASS
          provider.dispose_once=PASS
          bootstrap.retry=SUPPRESSED
          same_frame.native_fallback=PASS
          subsequent_frames.native_fallback=PASS
          gpu.context_created=YES
          gpu.target_created=YES
          gpu.cleanup=PASS
          consumer.full_interaction_smoke=PASS
          production.renderer.default=NATIVE_CANVAS
          production.desktop.graphite_dependency=ABSENT
          renderer.adoption=SHADOW_OPT_IN_ONLY
          public.api.change=NONE
          "@ | Set-Content -Path $failureManifest -Encoding UTF8

          Get-Content $fallbackSummary
          Get-Content $optInSummary
          Get-Content $failureSummary
          Get-Content $manifest
          Get-Content $failureManifest

      - name: Upload Graphite runtime provider activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-runtime-provider-activation-${{ github.sha }}
          path: |
            compose/graphite-runtime-package-probe/build/activation/graphite-runtime-provider-activation.txt
            compose/graphite-runtime-package-probe/build/activation/graphite-runtime-failure-fallback.txt
            compose/graphite-runtime-package-probe/build/activation/runtime-jar-entries.txt
            compose/graphite-runtime-package-probe/build/activation/fallback/smoke-summary.txt
            compose/graphite-runtime-package-probe/build/activation/fallback/*.png
            compose/graphite-runtime-package-probe/build/activation/opt-in/smoke-summary.txt
            compose/graphite-runtime-package-probe/build/activation/opt-in/*.png
            compose/graphite-runtime-package-probe/build/activation/failure-fallback/smoke-summary.txt
            compose/graphite-runtime-package-probe/build/activation/failure-fallback/*.png
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Graphite runtime packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-runtime-packaging-${{ github.sha }}
          path: |
            compose/graphite-runtime-package-probe/build/evidence/graphite-runtime-packaging.txt
            compose/graphite-runtime-package-probe/build/evidence/default-runtime-dependencies.txt
            compose/graphite-runtime-package-probe/build/evidence/opt-in-runtime-dependencies.txt
            compose/graphite-runtime-package-probe/build/repo/org/jetbrains/lets-plot/probe/lets-plot-compose-graphite-runtime-windows-x64-probe/0.153.0-PROBE/lets-plot-compose-graphite-runtime-windows-x64-probe-0.153.0-PROBE.pom
            compose/graphite-runtime-package-probe/build/repo/org/jetbrains/lets-plot/probe/lets-plot-compose-graphite-runtime-windows-x64-probe/0.153.0-PROBE/lets-plot-compose-graphite-runtime-windows-x64-probe-0.153.0-PROBE.module
          if-no-files-found: warn
          retention-days: 90

      - name: Upload PlotPanel Graphite interaction stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphite-plotpanel-shadow-skiko-${{ env.GRAPHITE_SKIKO_VERSION }}-${{ github.sha }}
          path: |
            compose/graphite-plotpanel-shadow-probe/build/probe/graphite-plotpanel-shadow.txt
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-initial.png
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-wheel-zoom.png
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-drag-pan.png
            compose/graphite-plotpanel-shadow-probe/build/probe/plotpanel-graphite-resized.png
            compose/graphite-plotpanel-shadow-probe/build/probe/graphite-plotpanel-shadow-dependencies.txt
            compose/graphite-plotpanel-shadow-probe/build/probe/windows-vulkan-environment.txt
          if-no-files-found: warn
          retention-days: 90


  graphite-renderer-readiness-gate:
    needs:
      - windows-compose-1-13-skiko-0-153-recompile-smoke
      - windows-graphite-canvas-rendering-probe
      - windows-graphite-plot-drawable-probe
      - windows-graphite-paint-bridge-probe
      - windows-graphite-offscreen-composite-probe
      - windows-compose-offscreen-integration-probe
      - windows-graphite-render-path-provider-probe
      - windows-plotpanel-persistent-graphite-shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Skiko 0.153 recompile evidence
        uses: actions/download-artifact@v4
        with:
          name: lets-plot-compose-recompiled-compose-1.13.0-alpha01-skiko-0.153.0-${{ github.sha }}
          path: evidence/recompile

      - name: Download Graphite Canvas evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-canvas-rendering-skiko-0.153.0-${{ github.sha }}
          path: evidence/canvas

      - name: Download Graphite PlotCanvasDrawable evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-plot-drawable-skiko-0.153.0-${{ github.sha }}
          path: evidence/plot-drawable

      - name: Download Graphite paint bridge evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-paint-bridge-skiko-0.153.0-${{ github.sha }}
          path: evidence/paint-bridge

      - name: Download Graphite offscreen composite evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-offscreen-composite-skiko-0.153.0-${{ github.sha }}
          path: evidence/offscreen-composite

      - name: Download Compose offscreen integration evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-compose-offscreen-integration-skiko-0.153.0-${{ github.sha }}
          path: evidence/compose-offscreen

      - name: Download desktop render path contract evidence
        uses: actions/download-artifact@v4
        with:
          name: desktop-render-path-contract-${{ github.sha }}
          path: evidence/render-path

      - name: Download Graphite render-path provider evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-render-path-provider-skiko-0.153.0-${{ github.sha }}
          path: evidence/graphite-provider

      - name: Download PlotPanel persistent Graphite shadow evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-plotpanel-shadow-skiko-0.153.0-${{ github.sha }}
          path: evidence/plotpanel-shadow

      - name: Download PlotPanel native and Graphite performance evidence
        uses: actions/download-artifact@v4
        with:
          name: plotpanel-native-graphite-performance-${{ github.sha }}
          path: evidence/plotpanel-performance

      - name: Download Graphite runtime packaging evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-runtime-packaging-${{ github.sha }}
          path: evidence/runtime-packaging

      - name: Download Graphite runtime provider activation evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-runtime-provider-activation-${{ github.sha }}
          path: evidence/runtime-activation
      - name: Download Graphite runtime compatibility evidence
        uses: actions/download-artifact@v4
        with:
          name: graphite-runtime-compatibility-${{ github.sha }}
          path: evidence/runtime-compatibility

      - name: Verify Graphite frontend readiness chain
        shell: bash
        run: |
          set -euo pipefail

          find_one() {
            local root="$1"
            local name="$2"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $name under $root, found ${#matches[@]}" >&2
              find "$root" -maxdepth 8 -type f -print | sort >&2
              exit 1
            fi

            printf '%s\n' "${matches[0]}"
          }

          recompile="$(find_one evidence/recompile baseline-manifest.txt)"
          canvas="$(find_one evidence/canvas graphite-canvas-rendering.txt)"
          plot="$(find_one evidence/plot-drawable graphite-plot-drawable.txt)"
          bridge="$(find_one evidence/paint-bridge graphite-paint-bridge.txt)"
          offscreen="$(find_one evidence/offscreen-composite graphite-offscreen-composite.txt)"
          compose_offscreen="$(find_one evidence/compose-offscreen graphite-compose-offscreen-integration.txt)"
          render_path="$(find_one evidence/render-path desktop-render-path.txt)"
          graphite_provider="$(find_one evidence/graphite-provider graphite-render-path-provider.txt)"
          plotpanel_shadow="$(find_one evidence/plotpanel-shadow graphite-plotpanel-shadow.txt)"
          plotpanel_performance="$(find_one evidence/plotpanel-performance plotpanel-performance-comparison.txt)"
          runtime_packaging="$(find_one evidence/runtime-packaging graphite-runtime-packaging.txt)"
          runtime_activation="$(find_one evidence/runtime-activation graphite-runtime-provider-activation.txt)"
          runtime_failure="$(find_one evidence/runtime-activation graphite-runtime-failure-fallback.txt)"
          runtime_compatibility="$(find_one evidence/runtime-compatibility graphite-runtime-compatibility-matrix.txt)"

          echo "Resolved readiness evidence:"
          printf '  recompile=%s\n  canvas=%s\n  plot=%s\n  bridge=%s\n  offscreen=%s\n  compose_offscreen=%s\n  render_path=%s\n  graphite_provider=%s\n  plotpanel_shadow=%s\n  plotpanel_performance=%s\n  runtime_packaging=%s\n  runtime_activation=%s\n  runtime_failure=%s\n  runtime_compatibility=%s\n' \
            "$recompile" "$canvas" "$plot" "$bridge" "$offscreen" "$compose_offscreen" "$render_path" "$graphite_provider" "$plotpanel_shadow" "$plotpanel_performance" "$runtime_packaging" "$runtime_activation" "$runtime_failure" "$runtime_compatibility"

          require_line() {
            local file="$1"
            local expected="$2"
            if ! tr -d '\r' < "$file" | grep -Fxq "$expected"; then
              echo "Missing readiness contract in $file: $expected" >&2
              echo "--- normalized evidence: $file ---" >&2
              tr -d '\r' < "$file" >&2
              exit 1
            fi
          }

          require_line "$recompile" "probe.result=PASS"
          require_line "$recompile" "frontend.recompiled=true"
          require_line "$recompile" "frontend.recompiled.skiko=0.153.0"
          require_line "$recompile" "frontend.graphite_compatibility_eligible=true"
          require_line "$recompile" "frontend.graphite_compatibility_profile=WINDOWS_X64_JDK21_GRAPHITE_0_153"
          require_line "$recompile" "frontend.graphite_compatibility_compose=1.13.0-alpha01"
          require_line "$recompile" "frontend.graphite_compatibility_skiko=0.153.0"
          require_line "$recompile" "renderer.adoption=NOT_STARTED"

          require_line "$canvas" "result=CANVAS_RENDERING_CAPABLE"
          require_line "$canvas" "bridge.software=PASS"
          require_line "$canvas" "bridge.graphite=PASS"
          require_line "$canvas" "comparison=PASS"

          require_line "$plot" "result=PLOT_DRAWABLE_CAPABLE"
          require_line "$plot" "plot.drawable.paint=PASS"
