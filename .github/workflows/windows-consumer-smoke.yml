name: Windows JDK 21 consumer smoke

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-consumer-smoke:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout lets-plot-compose
        uses: actions/checkout@v4
        with:
          path: compose

      - name: Checkout lets-plot core
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot
          ref: master
          path: core

      - name: Checkout lets-plot-kotlin
        uses: actions/checkout@v4
        with:
          repository: changhexuefei/lets-plot-kotlin
          ref: master
          path: kotlin-api

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure Lets-Plot core
        shell: pwsh
        run: |
          @"
          enable_python_package=false
          "@ | Set-Content -Path core/local.properties -Encoding UTF8

      - name: Publish Core 4.11.1-SNAPSHOT
        working-directory: core
        shell: pwsh
        run: .\gradlew.bat -Pbuild_release=true -Penable_python_package=false publishLetsPlotCoreModulesToMavenLocalRepository --stacktrace

      - name: Configure Lets-Plot Kotlin API
        shell: pwsh
        run: |
          $coreRepo = Join-Path $env:GITHUB_WORKSPACE "core\.maven-publish-dev-repo"
          @"
          sonatype.username=
          sonatype.password=
          maven.repo.local=$coreRepo
          "@ | Set-Content -Path kotlin-api/local.properties -Encoding UTF8

      - name: Publish Kotlin API 4.15.1-SNAPSHOT
        working-directory: kotlin-api
        shell: pwsh
        run: .\gradlew.bat :plot-api:publishAllPublicationsToMavenLocalRepository --stacktrace

      - name: Configure Lets-Plot Compose
        shell: pwsh
        run: |
          $coreRepo = Join-Path $env:GITHUB_WORKSPACE "core\.maven-publish-dev-repo"
          $kotlinRepo = Join-Path $env:GITHUB_WORKSPACE "kotlin-api\.maven-publish-dev-repo"
          @"
          sonatype.username=
          sonatype.password=
          maven.repo.local=$coreRepo,$kotlinRepo
          "@ | Set-Content -Path compose/local.properties -Encoding UTF8

      - name: Publish Compose 3.2.3-SNAPSHOT
        working-directory: compose
        shell: pwsh
        run: .\gradlew.bat :lets-plot-compose:publishAllPublicationsToMavenLocalRepository --stacktrace

      - name: Build and run standalone consumer
        working-directory: compose
        shell: pwsh
        env:
          LETS_PLOT_CORE_REPO: ${{ github.workspace }}\core\.maven-publish-dev-repo
          LETS_PLOT_KOTLIN_REPO: ${{ github.workspace }}\kotlin-api\.maven-publish-dev-repo
          LETS_PLOT_COMPOSE_REPO: ${{ github.workspace }}\compose\.maven-publish-dev-repo
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}\compose\consumer-smoke\build\smoke
        run: .\gradlew.bat -p consumer-smoke clean build run --stacktrace

      - name: Verify smoke summary
        shell: pwsh
        run: |
          $summary = "compose\consumer-smoke\build\smoke\smoke-summary.txt"
          if (!(Test-Path $summary)) {
            throw "Smoke summary was not created: $summary"
          }
          Get-Content $summary
          if (!(Select-String -Path $summary -Pattern "^result=PASS$" -Quiet)) {
            throw "Smoke summary does not contain result=PASS"
          }

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-jdk21-consumer-smoke
          path: |
            compose/consumer-smoke/build/smoke/*.png
            compose/consumer-smoke/build/smoke/smoke-summary.txt
          if-no-files-found: warn
          retention-days: 14
